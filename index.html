function mgTrashRestore() {
  const snap = snapshot(), set = MG.tsel, keep = [], stocks = new Set(data.stocks.map(s => s.id)), tombs = data.tombs.slice();
  let k = 0, miss = 0;
  data.trash.forEach(x => {
    if (!set.has(x.item.id)) { keep.push(x); return; }
    if (!stocks.has(x.item.stockId)) { miss++; keep.push(x); return; }
    (x.kind === 'strategy' ? data.strategies : data.notes).push(x.item); k++;
    if (x.kind !== 'strategy' && x.reason === 'delete') { const i = tombs.lastIndexOf(tombKey(x.item)); if (i >= 0) tombs.splice(i, 1); }
  });
  data.trash = keep; data.tombs = tombs; MG.tsel = new Set(); MG.groups = null;
  commit();
  setTimeout(() => toastAct(`已還原 ${k} 條${miss ? `；${miss} 條的標的已經刪除，無法還原` : ''}`, '復原', () => restoreSnap(snap)), 0);
}

function openStock(st) {
  const editing = !!st;
  st = st || { market: 'TW', code: '', name: '', target: null };
  openDialog({
    title: editing ? '編輯標的' : '新增標的',
    body: `${radio('market', [['TW', '台股'], ['US', '美股']], st.market)}
      <div class="r2">${fld('代號', inp('code', st.code, 'autocomplete="off" autocapitalize="characters" placeholder="2330 或 NVDA"'))}
      ${fld('名稱', `<div class="inl">${inp('name', st.name, 'placeholder="可自動帶入"')}<button type="button" class="btn" id="lookup">帶入</button></div>`)}</div>
      ${fld('目標價（選填）', numInp('target', st.target), '用來計算預期損益和距目標價的幅度。')}
      ${editing ? '' : `<div class="lbl" style="margin-bottom:6px">目前狀態</div>${radio('status', [['hold', '已持有，接著記一筆買進'], ['watch', '觀察中']], 'hold')}`}`,
    extra: editing ? `<button type="button" class="btn danger" data-act="del-stock">${ic('trash')}刪除</button>` : '',
    onOpen: f => {
      $('#lookup').onclick = async () => {
        const market = fv(f, 'market'), code = normCode(market, fv(f, 'code'));
        if (!code) { $('#dlgErr').textContent = '先輸入代號'; return; }
        if (!data.settings.apiUrl) { $('#dlgErr').textContent = '要先在設定填好報價來源，才能自動帶入名稱'; return; }
        $('#lookup').textContent = '查詢中…';
        try {
          const j = await fetchQuotes(market === 'TW' ? { tw: [code] } : { us: [code] });
          const q = j && (market === 'TW' ? (j.tw || {})[code] : (j.us || {})[code]);
          if (q && q.name) f.elements.name.value = q.name; else $('#dlgErr').textContent = '找不到這個代號';
        } catch (e) { $('#dlgErr').textContent = '查詢失敗：' + e.message; }
        $('#lookup').textContent = '帶入';
      };
      if (!editing) f.elements.code.focus();
    },
    onOk: f => {
      const market = fv(f, 'market'), code = normCode(market, fv(f, 'code'));
      if (!code) return '請輸入代號';
      if (market === 'TW' && !/^[0-9A-Z]{4,6}$/.test(code)) return '台股代號格式不對（例：2330、00878）';
      if (market === 'US' && !/^[A-Z0-9.\-^=]{1,12}$/.test(code)) return '美股代號格式不對（例：NVDA、BRK-B）';
      const dup = data.stocks.find(s => s.market === market && s.code === code && s.id !== st.id);
      if (dup) return '這個標的已經在清單裡了';
      const target = fnum(f, 'target');
      if (fv(f, 'target') && !(target > 0)) return '目標價要是正數';
      if (editing) {
        if (st.market !== market) st.exch = undefined;
        Object.assign(st, { market, code, name: fv(f, 'name'), target: target > 0 ? target : null });
        commit();
      } else {
        const ns = { id: uid(), market, code, name: fv(f, 'name'), target: target > 0 ? target : null, ts: Date.now() };
        data.stocks.push(ns);
        ui.sel = ns.id; ui.tab = fv(f, 'status') === 'hold' ? 'hold' : 'watch'; saveUi();
        commit();
        fetchQuotes();
        if (fv(f, 'status') === 'hold') setTimeout(() => openTrade(ns), 0);
      }
    }
  });
}
// 刪除標的：連同交易、股利、重點、策略一起刪；提示上可以復原
function delStock(st) {
  const own = k => data[k].filter(x => x.stockId === st.id).length;
  const nT = own('trades'), nD = own('dividends'), nN = own('notes'), nS = own('strategies');
  const parts = [nT && `${nT} 筆交易`, nD && `${nD} 筆股利`, nN && `${nN} 條重點`, nS && `${nS} 條策略`].filter(Boolean);
  if (!confirm(`確定刪除 ${st.code} ${st.name || ''}？${parts.length ? `\n它的 ${parts.join('、')} 也會一起刪除。` : ''}\n刪除後可以在提示上按「復原」。`)) return;
  const keep = {}, idx = data.stocks.indexOf(st), sel = ui.sel;
  ['trades', 'dividends', 'notes', 'strategies', 'trash', 'acctTx'].forEach(k => { keep[k] = data[k]; });
  const refs = new Set([...data.trades.filter(t => t.stockId === st.id).map(t => 't:' + t.id), ...data.dividends.filter(x => x.stockId === st.id).map(x => 'd:' + x.id)]);
  data.acctTx = data.acctTx.filter(t => !refs.has(t.ref));
  data.trades = data.trades.filter(t => t.stockId !== st.id);
  data.dividends = data.dividends.filter(x => x.stockId !== st.id);
  data.notes = data.notes.filter(x => x.stockId !== st.id);
  data.strategies = data.strategies.filter(x => x.stockId !== st.id);
  data.trash = data.trash.filter(x => !x.item || x.item.stockId !== st.id);
  data.stocks = data.stocks.filter(s => s.id !== st.id);
  ui.sel = null; ui.view = 'list'; saveUi();
  if (dlg.open) dlg.close();
  commit();
  toastAct(`已刪除 ${st.code} ${st.name || ''}`, '復原', () => {
    if (data.stocks.some(s => s.id === st.id)) return;
    data.stocks.splice(Math.min(idx, data.stocks.length), 0, st);
    // 只放回這一檔的資料，刪除之後其他標的的修改不受影響
    ['trades', 'dividends', 'notes', 'strategies'].forEach(k => { const have = new Set(data[k].map(x => x.id)); data[k] = data[k].concat(keep[k].filter(x => x.stockId === st.id && !have.has(x.id))); });
    data.trash = data.trash.concat(keep.trash.filter(x => x.item && x.item.stockId === st.id));
    const haveTx = new Set(data.acctTx.map(t => t.id));
    data.acctTx = data.acctTx.concat(keep.acctTx.filter(t => refs.has(t.ref) && !haveTx.has(t.id) && acctById(t.acct)));
    ui.sel = sel; saveUi(); commit(); fetchQuotes();
  }, 12000);
}
function normCode(market, s) { s = String(s || '').trim().toUpperCase(); if (market === 'TW') s = s.replace(/\.(TW|TWO)$/, ''); return s; }

function openTrade(st, tr, preset) {
  const editing = !!tr;
  const m = st.market, cur = curOf(st);
  tr = tr || Object.assign({ side: 'buy', date: today(), shares: '', price: '', fee: '', tax: '', note: '' }, preset || {});
  const touched = { fee: editing, tax: editing };
  openDialog({
    title: `${editing ? '編輯' : '新增'}交易　<span class="muted" style="font-size:14px">${stockLabel(st)}</span>`,
    body: `${radio('side', [['buy', '買進'], ['sell', '賣出']], tr.side)}
      <div class="r2">${fld('日期', inp('date', tr.date, 'type="date"'))}${fld('股數', numInp('shares', tr.shares, 'placeholder="' + (m === 'TW' ? '1000' : '10') + '"'), m === 'TW' ? '1 張 = 1,000 股；零股照實際股數填' : '可以有小數（零碎股）')}</div>
      <div class="r2">${fld(`成交價（${cur === 'USD' ? '美元' : '元'}）`, numInp('price', tr.price))}<div></div></div>
      <div class="r2">${fld(`手續費（${cur === 'USD' ? '美元' : '元'}）`, numInp('fee', tr.fee), '依設定的費率自動算，可改成對帳單金額')}
      ${m === 'TW' ? fld('證券交易稅（元）', numInp('tax', tr.tax), '賣出才有；ETF 自動用 ETF 稅率') : '<div></div>'}</div>
      ${fld('備註（選填）', inp('note', tr.note, 'placeholder="例：法說會後加碼"'))}
      <div class="pv" id="pv"></div>`,
    onOpen: f => update(f),
    onInput: (f, e) => { if (e && e.target && (e.target.name === 'fee' || e.target.name === 'tax') && e.type === 'input') touched[e.target.name] = true; update(f); },
    onOk: f => {
      const side = fv(f, 'side'), date = fv(f, 'date'), shares = fnum(f, 'shares'), price = fnum(f, 'price');
      const fee = fv(f, 'fee') === '' ? 0 : fnum(f, 'fee'), tax = m === 'TW' && fv(f, 'tax') !== '' ? fnum(f, 'tax') : 0;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return '請選日期';
      if (!(shares > 0)) return '股數要大於 0';
      if (m === 'TW' && !Number.isInteger(shares)) return '台股股數要是整數';
      if (!(price > 0)) return '成交價要大於 0';
      if (!(fee >= 0) || !(tax >= 0)) return '手續費和交易稅不能是負數';
      const rec = { side, date, shares, price, fee, tax, note: fv(f, 'note') };
      const backup = editing ? Object.assign({}, tr) : null;
      if (editing) Object.assign(tr, rec);
      else data.trades.push(Object.assign({ id: uid(), stockId: st.id, ts: Date.now() }, rec));
      if (oversold(st)) {
        if (editing) Object.assign(tr, backup); else data.trades.pop();
        return side === 'sell'
          ? `賣出股數超過 ${date} 當時的持股（目前共 ${fmtShares(calc(st).sh, m)}）`
          : '這樣修改後，之後某一筆賣出的股數會超過當時的持股';
      }
      const left = calc(st).sh;
      if (left <= 0) delete st.parked;
      ui.tab = left > 0 && !st.parked ? 'hold' : 'watch';
      const t = editing ? tr : data.trades[data.trades.length - 1];
      // 現金帳戶：新交易問要不要扣款／存入；改了交易，連動的那筆跟著改
      const synced = editing && cashSyncRef('t:' + t.id, tradeNet(t), t.date);
      saveUi(); commit();
      if (!editing && !data.demo) cashAskTrade(st, t);
      if (synced) setTimeout(() => toast('現金帳戶的那筆也一起更新了'), 50);
    }
  });
  function update(f) {
    const side = fv(f, 'side'), shares = fnum(f, 'shares'), price = fnum(f, 'price');
    const a = autoFee(st, side, shares || 0, price || 0);
    if (!touched.fee) f.elements.fee.value = shares > 0 && price > 0 ? a.fee : '';
    if (m === 'TW' && !touched.tax) f.elements.tax.value = shares > 0 && price > 0 ? a.tax : '';
    const amt = (shares || 0) * (price || 0);
    const fee = fnum(f, 'fee') || 0, tax = m === 'TW' ? (fnum(f, 'tax') || 0) : 0;
    const net = side === 'buy' ? amt + fee : amt - fee - tax;
    $('#pv').innerHTML = amt > 0
      ? `<span>成交金額 ${curSym(cur)}${fmtMoney(amt, cur)}</span><span>${side === 'buy' ? '應付' : '應收'} <b>${curSym(cur)}${fmtMoney(net, cur)}</b></span>`
      : '<span class="faint">輸入股數和成交價後會顯示金額</span>';
  }
}

function openDiv(st, x) {
  const editing = !!x, m = st.market, cur = curOf(st);
  x = x || { date: today(), type: 'cash', amount: '', deduct: '', shares: '', note: '' };
  openDialog({
    title: `${editing ? '編輯' : '新增'}股利　<span class="muted" style="font-size:14px">${stockLabel(st)}</span>`,
    body: `${editing && x.auto ? `<div class="note" style="margin:0 0 10px">這筆是自動算的：除息日 ${x.exDate}，每股 ${x.dps} × ${fmtShares(x.held, m)}。實際入帳不同就改成實際金額，改過之後不會再被自動覆蓋。</div>` : ''}${radio('type', [['cash', '現金股利'], ['stock', '股票股利（配股）']], x.type)}
      ${fld('日期（入帳日或除權息日）', inp('date', x.date, 'type="date"'))}
      <div id="cashF" class="r2">${fld(`股利總額（${cur === 'USD' ? '美元' : '元'}）`, numInp('amount', x.amount))}
      ${fld(`扣除額（${cur === 'USD' ? '美元' : '元'}）`, numInp('deduct', x.deduct, 'placeholder="0"'), m === 'TW' ? '二代健保補充保費、匯費等' : '預扣稅（一般 30%）等')}</div>
      <div id="stockF">${fld('配發股數', numInp('shares', x.shares), '例：每股配 0.5 元股票股利，1 張配 50 股')}</div>
      ${fld('備註（選填）', inp('note', x.note))}
      <div class="pv" id="pv"></div>`,
    onOpen: f => update(f),
    onInput: f => update(f),
    onOk: f => {
      const type = fv(f, 'type'), date = fv(f, 'date');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return '請選日期';
      const rec = { type, date, note: fv(f, 'note'), amount: 0, deduct: 0, shares: 0 };
      if (type === 'cash') {
        rec.amount = fnum(f, 'amount'); rec.deduct = fv(f, 'deduct') === '' ? 0 : fnum(f, 'deduct');
        if (!(rec.amount > 0)) return '股利總額要大於 0';
        if (!(rec.deduct >= 0) || rec.deduct > rec.amount) return '扣除額要介於 0 和股利總額之間';
      } else {
        rec.shares = fnum(f, 'shares');
        if (!(rec.shares > 0)) return '配發股數要大於 0';
      }
      if (editing) { if (x.auto && (x.amount !== rec.amount || x.deduct !== rec.deduct || x.date !== rec.date || x.type !== rec.type)) rec.edited = true; Object.assign(x, rec); }
      else data.dividends.push(Object.assign({ id: uid(), stockId: st.id, ts: Date.now() }, rec));
      const d = editing ? x : data.dividends[data.dividends.length - 1];
      if (editing) { if (d.type === 'cash') cashSyncRef('d:' + d.id, d.amount - d.deduct, d.date); else cashDropRef('d:' + d.id); }
      commit();
      if ($('#as').open) asRender();
      if (!editing && !data.demo) cashAskDiv(st, d);
    }
  });
  function update(f) {
    const cash = fv(f, 'type') === 'cash';
    $('#cashF').style.display = cash ? '' : 'none';
    $('#stockF').style.display = cash ? 'none' : '';
    const a = fnum(f, 'amount') || 0, d = fnum(f, 'deduct') || 0;
    $('#pv').innerHTML = cash ? (a > 0 ? `<span>實收</span><b>${curSym(cur)}${fmtMoney(a - d, cur)}</b>` : '<span class="faint">輸入股利總額後會顯示實收金額</span>')
      : '<span class="faint">配股會增加持股，總成本不變，所以平均成本會下降。</span>';
  }
}

/* ========== 同步（GitHub 私人 repo） ========== */
// 資料存成私人 repo 裡的 data.json；每次儲存都是一個 commit，等於自動留下歷史版本。
const DATA_PATH = 'data.json';
let syncTimer = null, syncing = false, syncAgain = false, ghLogin = null, remoteSha = null, remoteTxt = "", remotePlain = true;
function scheduleSync() { if (!conf.token) return; clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1500); }
async function gh(path, opt = {}, raw) {
  const headers = { 'Accept': raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'Authorization': 'Bearer ' + conf.token };
  if (opt.body) headers['Content-Type'] = 'application/json';
  const r = await fetch('https://api.github.com' + path, Object.assign({ cache: 'no-store' }, opt, { headers }));
  if (!r.ok) {
    const msg = { 401: 'token 無效或已過期', 403: 'token 權限不足（需要這個 repo 的 Contents 讀寫權限）', 404: '找不到資料 repo，或 token 沒有這個 repo 的權限', 409: '雲端資料剛好被其他裝置更新', 422: '雲端資料剛好被其他裝置更新' }[r.status] || ('GitHub 回應 ' + r.status);
    const err = new Error(msg); err.status = r.status; throw err;
  }
  return raw ? r.text() : r.json();
}
function payload() { const d = Object.assign({}, data); delete d.demo; return JSON.stringify(d, null, 1); }
function b64enc(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(b) {
  const bin = atob(String(b).replace(/\s/g, '')); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
async function repoPath() {
  let r = (conf.repo || 'stock-tracker-data').trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/+$/, '');
  if (!r.includes('/')) { if (!ghLogin) ghLogin = (await gh('/user')).login; r = ghLogin + '/' + r; }
  return r;
}
async function readRemote(rp) {
  try {
    const f = await gh(`/repos/${rp}/contents/${DATA_PATH}`);
    remoteSha = f.sha;
    let txt = f.content ? b64dec(f.content) : await gh(`/repos/${rp}/contents/${DATA_PATH}`, {}, true);
    let obj = JSON.parse(txt);
    remotePlain = !isEnvelope(obj);
    if (!remotePlain) {
      // 雲端是加密的：這台沒有同一把金鑰的話，要先輸入密碼
      const mine = VAULT.on && VAULT.dek && VAULT.hdr.kid === obj.kid;
      const prev = !mine && VAULT.prev && VAULT.prev.kid === obj.kid ? VAULT.prev.dek : null;   // 這台剛取消密碼：用原本的金鑰讀最後一次
      if (!mine && !prev) { const e = new Error('雲端資料已加密，需要密碼'); e.code = 'vault'; e.env = obj; throw e; }
      txt = td(await aesDec(mine ? VAULT.dek : prev, obj, obj.kid));
      // 別的裝置換了密碼或救援碼：資料金鑰一樣，更新這台記的包裝
      if (mine && (obj.hv || 0) > (VAULT.hdr.hv || 0)) { VAULT.hdr = Object.assign({}, VAULT.hdr, { p: obj.p, r: obj.r, hv: obj.hv }); store('st.vault', VAULT.hdr); }
      obj = JSON.parse(txt);
    }
    remoteTxt = txt;
    return obj;
  } catch (e) {
    if (e.status !== 404) throw e;
    await gh(`/repos/${rp}`);           // repo 本身存在嗎？不存在會在這裡丟出錯誤
    remoteSha = null;
    return null;                        // repo 在、檔案還沒建立
  }
}
async function writeRemote(rp, text) {
  text = text || payload();
  const body = { message: '同步 ' + new Date().toISOString(), content: b64enc(VAULT.on && VAULT.dek ? await vaultEnvelope(text) : text) };
  if (remoteSha) body.sha = remoteSha;
  const r = await gh(`/repos/${rp}/contents/${DATA_PATH}`, { method: 'PUT', body: JSON.stringify(body) });
  remoteSha = r && r.content && r.content.sha;
}
/* ---- 三方合併 ----
   base：上次同步時雲端的版本（存在這台裝置）。和它比，就知道哪邊新增、修改、刪除了什麼。
   兩邊各自的修改都保留；同一筆兩邊都改了用這台的；一邊刪除、一邊只是修改時，以刪除為準。 */
const baseGet = async rp => { const t = await sGet('base:' + rp); return typeof t === 'string' ? (() => { try { return JSON.parse(t); } catch (e) { return null; } })() : null; };
const baseSet = (rp, text) => sSet('base:' + rp, text);
const MERGE_KEY = { trash: x => x && x.item ? x.kind + ':' + x.item.id : JSON.stringify(x), tombs: x => String(x), dupIgnore: x => typeof x === 'string' ? x : JSON.stringify(x) };
function mergeArr(k, B, L, R) {
  const kf = MERGE_KEY[k] || (x => x && x.id != null ? 'i:' + x.id : 'j:' + JSON.stringify(x));
  const J = x => x === undefined ? '\u0000' : JSON.stringify(x);
  const mb = new Map((B || []).map(x => [kf(x), x])), ml = new Map(L.map(x => [kf(x), x])), mr = new Map(R.map(x => [kf(x), x]));
  const pick = id => {
    const b = mb.get(id), l = ml.get(id), r = mr.get(id);
    if (b === undefined) return l !== undefined ? l : r;            // 新增的
    const bs = J(b), lc = J(l) !== bs, rc = J(r) !== bs;
    if (!lc) return r;                                              // 這台沒動：用雲端的（含雲端刪除）
    if (!rc) return l;                                              // 雲端沒動：用這台的（含這台刪除）
    if (l === undefined || r === undefined) return undefined;       // 一邊刪除、一邊修改：刪除
    return l;                                                       // 兩邊都改：用這台的
  };
  // 順序（例如標的拖拉排序）：這台沒改順序就用雲端的
  const ord = (arr, other) => arr.map(kf).filter(id => mb.has(id) && other.has(id)).join('\n');
  const localMoved = ord(L, mb) !== ord(B || [], ml);
  const out = [], seen = new Set();
  [...(localMoved ? L : R), ...(localMoved ? R : L)].forEach(x => { const id = kf(x); if (seen.has(id)) return; seen.add(id); const v = pick(id); if (v !== undefined) out.push(v); });
  return out;
}
function mergeObj(B, L, R) {
  B = B || {}; L = L || {}; R = R || {};
  const out = {}, J = x => x === undefined ? '\u0000' : JSON.stringify(x);
  new Set([...Object.keys(B), ...Object.keys(L), ...Object.keys(R)]).forEach(k => { const v = J(L[k]) !== J(B[k]) ? L[k] : R[k]; if (v !== undefined) out[k] = v; });
  return out;
}
function merge3(B, L, R) {
  const o = Object.assign({}, R, L);
  DATA_ARRAYS.forEach(k => { o[k] = mergeArr(k, B[k], L[k] || [], R[k] || []); });
  o.settings = mergeObj(B.settings, L.settings, R.settings);
  o.newsAct = mergeObj(B.newsAct, L.newsAct, R.newsAct);
  // 標的被刪掉了：它的交易、股利、重點、策略也不留
  const ids = new Set(o.stocks.map(x => x.id));
  ['trades', 'dividends', 'notes', 'strategies'].forEach(k => { o[k] = o[k].filter(x => !x.stockId || ids.has(x.stockId)); });
  o.trash = o.trash.filter(x => !x.item || !x.item.stockId || ids.has(x.item.stockId));
  // 帳戶被刪掉、或連動的交易／股利不在了：那筆進出也不留
  const aIds = new Set(o.accounts.map(a => a.id)), tIds = new Set(o.trades.map(t => 't:' + t.id)), dIds = new Set(o.dividends.map(x => 'd:' + x.id));
  o.acctTx = o.acctTx.filter(t => aIds.has(t.acct) && (!/^[td]:/.test(t.ref || '') || tIds.has(t.ref) || dIds.has(t.ref)));
  o.acctBal = o.acctBal.filter(b => aIds.has(b.acct));

}
async function sync() {
  if (!conf.token) return;
  if (data.demo) { syncState = { status: 'off', msg: '示範資料不會同步', at: 0 }; renderStatus(); return; }
  if (syncing) { syncAgain = true; return; }
  syncing = true; syncState.status = 'busy'; renderStatus();
  // 寫上雲端，並記下雲端現在的版本（之後合併用）
  let pushed = false;
  const push = async rp => { const text = payload(), at = data.updatedAt; await writeRemote(rp, text); conf.syncedAt = at; baseSet(rp, text); pushed = true; };
  const adopt = (rp, remote) => { adoptRemote(remote); conf.syncedAt = data.updatedAt; baseSet(rp, remoteTxt); };
  try {
    const rp = await repoPath();
    const remote = await readRemote(rp);
    if (!remote) await push(rp);
    else {
      const rAt = remote.updatedAt || 0;
      const remoteChanged = rAt > (conf.syncedAt || 0) && rAt !== data.updatedAt;
      if (remoteChanged) {
        const localHasData = data.stocks.length || data.trades.length || data.notes.length;
        if (conf.dirty && localHasData) {
          const base = await baseGet(rp);
          if (base) {
            // 兩邊都有修改：自動合併，不用選
            data = normalize(merge3(base, JSON.parse(payload()), remote));
            saveData(); render(); if (MG.open) mgRender();
            await push(rp);
            toast('已合併其他裝置的修改');
          } else {
            const useRemote = confirm('雲端有其他裝置更新過的資料，這台裝置也有還沒同步的修改。\n\n按「確定」：改用雲端的資料（這台的修改會被捨棄）\n按「取消」：用這台的資料覆蓋雲端');
            if (useRemote) adopt(rp, remote); else await push(rp);
          }
        } else adopt(rp, remote);
      } else if (conf.dirty) await push(rp);
      else if (!(await baseGet(rp))) baseSet(rp, remoteTxt);   // 第一次用合併：先記下雲端目前的版本
      // 密碼保護：別的裝置取消了，這台也取消；雲端還是沒加密的（例如舊版網頁寫的），重新傳一份加密的
      if (VAULT.on && remotePlain && data.settings.vault === 'off') { syncing = false; await vaultTurnOff(); toast('其他裝置取消了密碼保護，這台也跟著取消'); return; }
      if (VAULT.on && VAULT.dek && remotePlain && !pushed && conf.syncedAt === data.updatedAt) await push(rp);
    }
    // 同步途中又有修改：維持「未同步」，馬上再同步一次
    conf.dirty = data.updatedAt !== conf.syncedAt;
    if (conf.dirty) syncAgain = true;
    saveConf();
    syncState = { status: 'ok', msg: '', at: Date.now() };
  } catch (e) {
    syncState = { status: 'err', msg: e.message, at: 0 };
    if (e.status === 409 || e.status === 422) syncAgain = true;
    if (e.code === 'vault') {
      syncing = false; renderStatus();
      if (await vaultAdoptRemote(e.env)) { conf.syncedAt = 0; saveConf(); sync(); }
      else { syncState = { status: 'err', msg: '雲端資料已加密，按同步鈕輸入密碼', at: 0 }; renderStatus(); }
      return;
    }
  }
  syncing = false;
  renderStatus();
  if (syncAgain) { syncAgain = false; setTimeout(sync, 300); }
}
function adoptRemote(remote) {
  data = normalize(remote);
  delete data.demo;
  saveData();
  render();
  fetchQuotes();
}

/* ========== 備份 ========== */
async function exportData() {
  // 有設密碼：備份檔也加密（用同一個密碼或救援碼匯入）
  const enc = VAULT.on && VAULT.dek;
  const blob = new Blob([enc ? await vaultEnvelope(payload()) : payload()], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'stock-tracker-backup-' + today().replace(/-/g, '') + (enc ? '-encrypted' : '') + '.json';
  if (enc) setTimeout(() => toast('備份檔已加密，匯入時要輸入密碼或救援碼'), 100);
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('#fileIn').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    let obj = JSON.parse(await file.text());
    if (isEnvelope(obj)) {
      const r = await lockAsk(obj, '這個備份檔有加密，輸入當時的密碼或救援碼');
      if (!r) return;
      const k = await importDek(r.raw);
      obj = JSON.parse(td(await aesDec(k, obj, obj.kid)));
    }
    if (!obj || !Array.isArray(obj.stocks)) throw new Error('不是這個網頁匯出的備份檔');
    if (!confirm(`備份裡有 ${obj.stocks.length} 檔標的、${(obj.trades || []).length} 筆交易。\n要用它取代目前的資料嗎？`)) return;
    data = normalize(obj); delete data.demo; ui.sel = null;
    if (dlg.open) dlg.close();
    commit(); fetchQuotes();
  } catch (err) { alert('匯入失敗：' + err.message); }
});

document.addEventListener('click', e => {

    case 'tab': ui.tab = a.dataset.tab; saveUi(); render(); break;
    case 'sel':

    case 'mtab': ui.mtab = a.dataset.tab; if (dlg.open) dlg.close(); render(); window.scrollTo(0, 0); break;
    case 'add-stock': openStock(); break;
    case 'edit-stock': if (st) openStock(st); break;
    case 'del-stock': if (st) delStock(st); break;
    case 'add-trade': if (st) openTrade(st); break;
    case 'edit-trade': { const t = data.trades.find(x => x.id === id); if (st && t) openTrade(st, t); break; }
    case 'del-trade':
      if (confirm('確定刪除這筆交易？' + (txOf('t:' + id) ? '\n現金帳戶裡連動的那筆也會一起刪除。' : ''))) {
        const before = data.trades;
        data.trades = data.trades.filter(x => x.id !== id);
        if (st && oversold(st)) { data.trades = before; alert('刪掉這筆買進後，之後的賣出股數會超過持股。請先刪除或修改之後的賣出交易。'); break; }
        cashDropRef('t:' + id);
        commit();
      }
      break;
    case 'add-div': if (st) openDiv(st); break;
    case 'edit-div': { const x = data.dividends.find(v => v.id === id); if (st && x) openDiv(st, x); break; }
    case 'del-div': {
      const x0 = data.dividends.find(v => v.id === id);
      if (confirm('確定刪除這筆股利紀錄？' + (x0 && x0.auto ? '\n這筆是自動算的，刪掉後不會再自動加回來。' : '') + (txOf('d:' + id) ? '\n現金帳戶裡連動的那筆也會一起刪除。' : ''))) {
        const before = data.dividends;
        data.dividends = data.dividends.filter(v => v.id !== id);
        if (st && oversold(st)) { data.dividends = before; alert('刪掉這筆配股後，之後的賣出股數會超過持股。請先修改之後的賣出交易。'); break; }
        if (x0 && x0.auto) data.divSkip.push(id);
        cashDropRef('d:' + id);
        commit();
      }
      break;
    }
    case 'settings': openSettings(); break;
    case 'kint': if (ui.kInt !== a.dataset.int) { ui.kInt = a.dataset.int; saveUi(); render(); kLoad(); } break;
    case 'ktog': ui[a.dataset.k] = ui[a.dataset.k] === false; saveUi(); render(); break;
    case 'kreset': if (K.chart) K.chart.resetView(); break;
    case 'prompt': openPrompt(); break;
    case 'import': openImport(st); break;
    case 'gpt': openGpt(); break;
    case 'mem': if (st) openMemory(st); break;
    case 'unpark': if (st) { delete st.parked; ui.tab = 'hold'; saveUi(); commit(); toast('已移回持有'); } break;
    case 'add-note': if (st) openNote(st); break;
    case 'edit-note': { const n = data.notes.find(x => x.id === id); if (st && n) openNote(st, n); break; }
    case 'del-note': if (dlg.open) dlg.close(); trashNotes([id]); break;      // 放進回收桶，可以馬上復原
    case 'topics': openManager({ tab: 'cats', stock: st ? st.id : '' }); break;
    case 'mgr': openManager({}); break;
    case 'mgr-stock': openManager({ stock: st ? st.id : '' }); break;
    case 'hiwin': { const i = HI_WINS.indexOf(+ui.hiWin); ui.hiWin = HI_WINS[(i + 1) % HI_WINS.length]; saveUi(); render(); break; }
    case 'note-go': {
      const n = noteById(id); if (!n) break;
      if (n.stockId !== ui.sel) { ui.sel = n.stockId; ui.noteHl = new Set(); }
      ui.noteTopic = ''; ui.noteClaim = ''; ui.noteAnalyst = ''; ui.noteStance = ''; if (isOld(n)) ui.noteShowOld = true;
      ui.noteOpen.add(id); ui.noteHl = new Set([id]); saveUi(); render();
      const el = document.querySelector(`#p-notes [data-nid="${id}"]`); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      break;
    }
    case 'ntopic': ui.noteTopic = a.dataset.topic; ui.noteStance = ''; saveUi(); renderNotes(); break;
    case 'ntab': ui.noteTab = a.dataset.tab; renderNotes(); break;
    case 'note-more': ui.notePage = (ui.notePage || NOTE_PAGE) + NOTE_PAGE; renderNotes(); break;
    case 'news-add': { const cl = NEWS.cl && NEWS.cl.get(id); if (st && cl) newsToNote(st, cl); break; }
    case 'news-skip': { const cl = NEWS.cl && NEWS.cl.get(id); if (cl) newsSetAct(cl.list.map(x => x.id), 'd', '已略過 1 則'); break; }
    case 'news-undo': { const cl = NEWS.cl && NEWS.cl.get(id); if (cl) newsSetAct(cl.list.map(x => x.id), null); break; }
    case 'news-skip-sel': {
      const k = ui.newsSel.size, ids = [...ui.newsSel].flatMap(x => ((NEWS.cl && NEWS.cl.get(x)) || { list: [] }).list.map(y => y.id));
      ui.newsSel.clear(); newsSetAct(ids, 'd', `已略過 ${k} 則`); break;
    }

    case 'news-gpt': { const cls = [...ui.newsSel].map(x => NEWS.cl && NEWS.cl.get(x)).filter(Boolean); if (cls.length) openNewsPrompt(cls); break; }
    case 'news-refresh': if (st) { NEWS.err = ''; toast('更新新聞中…'); newsLoad([newsKey(st)], { force: true }).then(() => { renderNotes(); if (K.st === st) kOverlay(st, calc(st)); }); } break;
    case 'news-older': if (st) { const mo = newsOlder(st)[0]; if (mo) newsLoad([newsKey(st)], { months: [mo], force: true }).then(() => renderNotes()); } break;
    case 'news-more': ui.newsPage = (ui.newsPage || 40) + 40; renderNotes(); break;
    case 'news-run': newsRun(); break;
    case 'vault-on': vaultEnable(); break;
    case 'vault-change': vaultChange(false); break;
    case 'vault-rc': vaultNewRc(); break;
    case 'vault-off': vaultDisable(); break;
    case 'vault-lock': lockNow(); break;
    case 'fin-verify': { const s2 = data.stocks.find(x => x.id === a.dataset.sid); if (s2) finVerifyAll(s2); break; }
    case 'copy-proj': copyText(projectRules()).then(ok => { if (!ok) { toast('沒辦法自動複製'); return; } conf.gptProjHash = strHash(promptRules('all')); conf.gptProject = true; saveConf(); const f = a.closest('form'); const cb = f && f.querySelector('#gptProj'); if (cb) cb.checked = true; if (f && f._updPrompt) f._updPrompt(); toast('已複製專案指示，貼到 ChatGPT 專案的「指示」'); }); break;
    case 'fin-metric': { ui.finMetric = a.dataset.m; saveUi(); const w = a.closest('.fch-m'), s2 = w && data.stocks.find(x => x.id === w.dataset.sid); if (s2) w.parentElement.innerHTML = finQChart(s2, +w.dataset.n); break; }
    case 'gen-key': genKeyUI(a); break;
    case 'copy-key': { const n = $('#keyHelp'); if (n) copyText(n.dataset.line).then(ok => toast(ok ? '已複製，貼到 Code.gs' : '沒辦法自動複製，請手動選取')); break; }
    case 'run-check': runCheck(); break;
    case 'copy-diag': copyText(chkReport()).then(ok => toast(ok ? '已複製診斷報告' : '沒辦法自動複製')); break;
    case 'news-watch': newsWatchSync(true).then(() => { toast('已傳送追蹤清單'); newsStatusShow(); }); break;
    case 'mgr-news': openManager({ tab: 'news', stock: st ? st.id : '' }); break;
    case 'dtab': ui.dtab = a.dataset.tab; render(); break;
    case 'co-open': if (st) openCompany(st); break;
    case 'fin-refresh': if (st) {
      FIN.tried.delete(newsKey(st)); FIN.err = ''; toast('讀取公司資料中…');
      finLoad([newsKey(st)], { force: true }).then(() => { render(); if ($('#co').open) openCompany(st, true); toast(FIN.err ? '讀取失敗：' + FIN.err : '已更新'); });
    } break;
    case 'add-strat': if (st) openStrategy(st); break;
    case 'edit-strat': { const x = data.strategies.find(v => v.id === id); if (st && x) openStrategy(st, x); break; }
    case 'del-strat': if (confirm('確定刪除這條策略？')) { data.strategies = data.strategies.filter(v => v.id !== id); if (dlg.open) dlg.close(); commit(); } break;
    case 'note-open': {
      ui.noteOpen.has(id) ? ui.noteOpen.delete(id) : ui.noteOpen.add(id);
      const n = data.notes.find(x => x.id === id);
      if (n && !isMobile()) { ui.noteHl = new Set([id]); kFocusDate(n.date); ui.noteHl = new Set([id]); }
      renderNotes(); break;
    }
    case 'note-k': {
      const n = data.notes.find(x => x.id === id); if (!n) break;
      ui.noteHl = new Set([id]);
      if (isMobile()) { ui.mtab = 'quote'; render(); window.scrollTo(0, 0); }
      kFocusDate(n.date); break;
    }
    case 'theme':
      conf.theme = conf.theme === 'dark' ? 'light' : 'dark'; saveConf();
      document.documentElement.dataset.theme = conf.theme;
      document.querySelector('meta[name="theme-color"]').content = conf.theme === 'dark' ? '#0E1117' : '#FFFFFF';
      render(); break;
    case 'refresh': if (data.settings.apiUrl) fetchQuotes(); else openSettings(); break;
    case 'sync': if (conf.token) sync(); else openSettings(); break;
    case 'demo': loadDemo(); break;
    case 'clear-demo': clearDemo(); break;
    case 'export': exportData(); break;
    case 'import-backup': $('#fileIn').click(); break;
    case 'wipe':
      if (confirm('清除這台裝置上的所有資料和設定（包括 token）？\nGitHub 上的資料不會被刪除，之後填回 token 就能拿回資料' + (VAULT.on ? '（要輸入密碼）' : '') + '。')) wipeLocal();
      break;
  }
});

/* ========== 可調整大小的版面 ========== */
const LAYOUT_DEF = { cl: 51, lt: 55, rt: 55, ms: 380 };
let layout = Object.assign({}, LAYOUT_DEF, load('st.layout') || {});
function applyLayout() {
  const g = $('#grid');
  g.style.setProperty('--cl', layout.cl + '%'); g.style.setProperty('--lt', layout.lt + '%'); g.style.setProperty('--rt', layout.rt + '%');
  document.documentElement.style.setProperty('--ms', layout.ms + 'px');
}
let RS = null;
document.addEventListener('pointerdown', e => {
  const sp = e.target.closest('.split');
  if (!sp || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault();
  const k = sp.dataset.split;
  const box = (k === 'cl' ? $('#grid') : k === 'ms' ? sp.parentElement : sp.parentElement).getBoundingClientRect();
  RS = { k, box, el: sp };
  sp.classList.add('on');
  document.body.classList.add('resizing', k === 'cl' || k === 'ms' ? 'rv' : 'rh');
});
document.addEventListener('pointermove', e => {
  if (!RS) return;
  const b = RS.box, cl = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  if (RS.k === 'cl') layout.cl = cl((e.clientX - b.left - 10) / (b.width - 20) * 100, 25, 75);
  else if (RS.k === 'ms') layout.ms = cl(b.right - e.clientX, 260, Math.max(300, b.width * 0.6));
  else layout[RS.k] = cl((e.clientY - b.top) / b.height * 100, 15, 85);
  applyLayout();
});
const rsEnd = () => { if (!RS) return; RS.el.classList.remove('on'); document.body.classList.remove('resizing', 'rv', 'rh'); RS = null; store('st.layout', layout); };
document.addEventListener('pointerup', rsEnd);
document.addEventListener('pointercancel', rsEnd);
document.addEventListener('dblclick', e => {
  const sp = e.target.closest('.split'); if (!sp) return;
  layout[sp.dataset.split] = LAYOUT_DEF[sp.dataset.split]; applyLayout(); store('st.layout', layout);
});

/* ========== 啟動 ========== */
applyLayout();
if (conf.theme !== 'dark') document.querySelector('meta[name="theme-color"]').content = '#FFFFFF';
ui.view = 'list';

  setInterval(() => autoReview(), 6 * 3600e3);
})();
