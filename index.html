<!doctype html>
<html lang="zh-Hant-TW" data-theme="dark">
<head>

<script>
try { var c = JSON.parse(localStorage.getItem('st.conf') || '{}'); document.documentElement.dataset.theme = c.theme || 'dark'; } catch (e) {}
</script>
<style>
:root[data-theme="dark"]{--bg:#0E1117;--panel:#151A21;--panel2:#1C222B;--line:#262D37;--line2:#353D49;--tx:#E6EDF3;--tx2:#9AA4AF;--tx3:#6B7480;--ac:#4C8DFF;--acbg:rgba(76,141,255,.14);--red:#F04B4B;--green:#2EBD85;--warn:#E3A008;--shade:rgba(0,0,0,.6)}
:root[data-theme="light"]{--bg:#F1F2F4;--panel:#FFFFFF;--panel2:#F5F6F8;--line:#E3E5E8;--line2:#D3D6DB;--tx:#1A1D21;--tx2:#5F6670;--tx3:#8A9099;--ac:#2563EB;--acbg:rgba(37,99,235,.09);--red:#E03131;--green:#12A150;--warn:#B7791F;--shade:rgba(15,20,30,.4)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column;height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num,td,.v,.big{font-variant-numeric:tabular-nums}
.r{color:var(--red)}.g{color:var(--green)}.muted{color:var(--tx2)}.faint{color:var(--tx3)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sp{flex:1}
h2{font-size:15px;font-weight:500;margin:0}
h3{font-size:16px;font-weight:500;margin:0}

.top{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;padding-top:max(8px,env(safe-area-inset-top))}
.brand{font-weight:700;font-size:16px;letter-spacing:.5px;white-space:nowrap}
.sum{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;min-width:0}
.sum::-webkit-scrollbar{display:none}
.chip{white-space:nowrap}
.chip .k{font-size:11px;color:var(--tx2);display:block;line-height:1.3}
.chip .v{font-size:15px;font-weight:500;line-height:1.3}
.chip .v small{font-size:12px;font-weight:400;margin-left:4px}
.st{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--tx2);white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tx3);margin-right:4px;vertical-align:1px}
.dot.on{background:var(--green)}
.acts{display:flex;gap:4px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--tx2);cursor:pointer;padding:0}
.ibtn:hover{background:var(--panel2);color:var(--tx)}
.ibtn.sm{width:26px;height:26px}.ibtn.sm .ic{width:15px;height:15px}
.ibtn.ok{color:var(--tx2)}.ibtn.err{color:var(--red)}.ibtn.busy .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line2);background:transparent;border-radius:7px;padding:4px 10px;cursor:pointer;white-space:nowrap;font-size:13px}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn .ic{width:15px;height:15px}

.banner{display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:13px;background:var(--acbg);border-bottom:1px solid var(--line);flex:none}
.banner.warn{background:rgba(227,160,8,.12)}
.banner:empty{display:none}

.mbar{display:none}
.grid{flex:1;min-height:0;display:flex;padding:10px}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
#colL{width:var(--cl,51%);flex:none;min-width:300px}
#colR{flex:1;min-width:300px}
#p-list{height:var(--lt,55%);flex:none;min-height:120px}
#p-detail{flex:1;min-height:110px}
#p-quote{height:var(--rt,55%);flex:none;min-height:180px}
#p-notes{flex:1;min-height:110px}
.split{flex:none;position:relative;touch-action:none;z-index:2}
.split.v{width:10px;cursor:col-resize}
.split.h{height:10px;cursor:row-resize}
.split::after{content:'';position:absolute;border-radius:2px;background:var(--line2);opacity:0;transition:opacity .15s,background .15s}
.split.v::after{left:4px;top:50%;width:2px;height:44px;margin-top:-22px}
.split.h::after{top:4px;left:50%;height:2px;width:44px;margin-left:-22px}
.split:hover::after{opacity:1}
.split.on::after{opacity:1;background:var(--ac)}
body.resizing,body.resizing *{user-select:none;-webkit-user-select:none}
body.resizing.rv *{cursor:col-resize!important}
body.resizing.rh *{cursor:row-resize!important}
.panel{container-type:inline-size}
@container (max-width:520px){td.hide-m,th.hide-m,.kbar .hide-m,.ph span.hide-m{display:none}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line);flex:none;min-height:46px}
.pb{flex:1;overflow:auto;padding:10px 12px;min-height:0}

.tabs{display:flex;gap:2px;background:var(--panel2);border-radius:8px;padding:2px}
.tabs button{border:0;background:transparent;padding:4px 12px;border-radius:6px;cursor:pointer;color:var(--tx2);font-size:13px}
.tabs button.on{background:var(--panel);color:var(--tx);box-shadow:0 0 0 1px var(--line)}
.tabs button .n{margin-left:4px;color:var(--tx3);font-size:12px}

table.t{width:100%;border-collapse:collapse}
.t th{font-weight:400;font-size:12px;color:var(--tx2);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1;white-space:nowrap}
.t td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t th:first-child,.t td:first-child{text-align:left;padding-left:4px}
.t tr.row{cursor:pointer}
.t tr.row:hover td{background:var(--panel2)}
.t tr.row.sel td{background:var(--acbg)}
.t tr.grp td{background:transparent;color:var(--tx2);font-size:12px;padding-top:12px;text-align:left}
.t tr.grp td .gs{float:right}
.nm b{font-weight:500;margin-right:6px}
.nm span{color:var(--tx2);font-size:13px}
.sub{font-size:12px}
.tw{overflow-x:auto;max-width:100%}
.only-m{display:none}
.t.small td,.t.small th{padding:6px}
.t.small td{font-size:13px}
.side{display:inline-block;font-size:12px;padding:0 6px;border-radius:4px;border:1px solid currentColor}

.mets{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.met{background:var(--panel2);border-radius:8px;padding:7px 10px;min-width:0}
.met .k{font-size:12px;color:var(--tx2)}
.met .v{font-size:15px;font-weight:500;line-height:1.35}
.met .v small{font-size:12px;font-weight:400;margin-left:4px;white-space:nowrap;display:inline-block}
.note{font-size:12px;color:var(--tx3);margin:6px 0 2px}
.sec{display:flex;align-items:center;gap:8px;margin:16px 0 6px}
.sec h3{font-size:14px}
.empty{color:var(--tx2);text-align:center;padding:28px 12px;font-size:13px}
.empty .btns{display:flex;gap:8px;justify-content:center;margin-top:12px}

.tag{font-size:12px;padding:1px 7px;border-radius:5px;background:var(--panel2);color:var(--tx2);white-space:nowrap}
.tag.ac{background:var(--acbg);color:var(--ac)}
.qhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-size:28px;font-weight:500;line-height:1.15}
.qchg{font-size:15px}
.src{font-size:12px;color:var(--tx3);margin-top:2px}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 14px;margin-top:12px}
.qgrid div{display:flex;justify-content:space-between;font-size:13px;border-bottom:1px dashed var(--line);padding:3px 0}
.qgrid .k{color:var(--tx2)}
.soon{border:1px dashed var(--line2);border-radius:10px;padding:16px;color:var(--tx2);font-size:13px;margin-top:12px}
.soon b{color:var(--tx);font-weight:500;display:block;margin-bottom:4px}

dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line2);border-radius:12px;padding:0;width:min(520px,94vw);max-height:90dvh}
dialog::backdrop{background:var(--shade)}
dialog.wide{width:min(720px,96vw)}
.qb{display:flex;flex-direction:column;gap:8px}
.qline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qline .src{margin:0}
.qstats{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12px;color:var(--tx2)}
.qstats b{font-weight:500;color:var(--tx);margin-left:4px}
.qstats b.r{color:var(--red)}.qstats b.g{color:var(--green)}
.kbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tog{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:2px 10px;font-size:12px;color:var(--tx2);cursor:pointer}
.tog.on{border-color:var(--ac);color:var(--ac);background:var(--acbg)}
.kwrap{position:relative;flex:1;min-height:230px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kcv{position:absolute;left:0;top:0;display:block;cursor:crosshair}
.klegend{position:absolute;left:8px;top:5px;right:70px;font-size:12px;line-height:1.55;pointer-events:none;z-index:1;color:var(--tx2)}
.klegend b{font-weight:500;color:var(--tx)}.klegend b.r{color:var(--red)}.klegend b.g{color:var(--green)}
.kmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--tx2);font-size:13px;pointer-events:none;z-index:1;padding:20px;text-align:center}
.kmsg:empty{display:none}
.kday{flex:none;font-size:13px}
.kday:empty{display:none}
.kd-h{display:flex;align-items:center;font-size:12px;color:var(--tx2);margin-bottom:4px}
.kd-it{padding:3px 0;border-bottom:1px dashed var(--line)}
.kd-sum{margin-left:10px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.dotc{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip2{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:2px 10px;font-size:12px;color:var(--tx2);cursor:pointer;white-space:nowrap}
.chip2.on{border-color:var(--ac);color:var(--ac);background:var(--acbg)}
.mon{font-size:12px;color:var(--tx3);margin:14px 0 6px}
.nt{border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.nt:hover{border-color:var(--line2)}
.nt.hl{border-color:var(--ac);background:var(--acbg)}
.nt-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2);min-height:26px}
.nt-top .tp{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp .nt-top{flex-wrap:wrap}
.pill{font-size:11px;padding:0 7px;border-radius:999px;border:1px solid currentColor;line-height:18px;white-space:nowrap}
.nt-title{font-weight:500;margin-top:1px}
.nt-body{font-size:13px;color:var(--tx2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.nt.open .nt-body{display:block}
.nt-src{font-size:12px;color:var(--tx3);margin-top:4px;display:none}
.nt.open .nt-src{display:block}
.steps{border:1px dashed var(--line2);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--tx2)}
.steps b{color:var(--tx);font-weight:500}
.steps ol{margin:8px 0 0 18px;padding:0}
.steps li{margin-bottom:4px}
.prompt{width:100%;min-height:300px;font-size:12.5px;line-height:1.55;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:10px;color:var(--tx);resize:vertical}
.map-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;flex-wrap:wrap}
.map-row select{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:4px 8px}
.imp{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.imp input{margin-top:5px;flex:none}
.newtag{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 4px}
.hdl{width:20px;cursor:grab;color:var(--tx3);touch-action:none;user-select:none;-webkit-user-select:none;text-align:center!important;padding-left:2px!important;padding-right:0!important;font-size:15px;line-height:1}
.hdl:hover{color:var(--tx)}
.t td.tl,.t th.tl{text-align:left}
tr.row.dragging td{opacity:.35}
tr.row.ins-before td{box-shadow:inset 0 2px 0 var(--ac)}
tr.row.ins-after td{box-shadow:inset 0 -2px 0 var(--ac)}
.tabs button.drop-on{background:var(--acbg);color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.ghost{position:fixed;z-index:80;pointer-events:none;background:var(--panel);color:var(--tx);border:1px solid var(--ac);border-radius:8px;padding:6px 12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.35);transform:translate(14px,-50%);white-space:nowrap}
.ghost b{font-weight:500}
body.dnd,body.dnd *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.mk{font-size:11px;color:var(--tx2);border:1px solid var(--line2);border-radius:4px;padding:0 4px;margin-right:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:13px}
.opt input{margin-top:3px}
.opt:has(input:checked){border-color:var(--ac);background:var(--acbg)}
.pgrp{border:1px solid var(--line);border-radius:10px;padding:10px 12px 2px;margin-bottom:12px}
.pg-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.pg-h b{font-weight:500}
.pg-h select,.map-row select{max-width:100%}
.pg-h select{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:4px 8px}
.pg-map{background:var(--panel2);border-radius:8px;padding:8px 10px 2px;margin:6px 0}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:12px;cursor:pointer}
.chk input{margin-top:3px}
dialog.mem{--bg:#04050C;--panel:#0B0F22;--panel2:#121935;--line:#1C2545;--line2:#2B3762;--tx:#E9EEFF;--tx2:#A3ADC9;--tx3:#6E7797;--ac:#7AB0FF;--acbg:rgba(122,176,255,.16);color:var(--tx);width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;border:0;border-radius:0;padding:0;background:var(--bg)}
dialog.mem[open]{display:flex;flex-direction:column}
.mem-top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex:none;padding-top:max(10px,env(safe-area-inset-top))}
.mem-top b{font-weight:500;font-size:15px}
.mem-ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mem-top .tog{white-space:nowrap}
.mem-body{flex:1;min-height:0;display:flex}
.mem-stage{position:relative;flex:1;min-width:0;overflow:hidden}
.mem-cv{position:absolute;left:0;top:0;cursor:grab;display:block}
.mem-legend{position:absolute;left:12px;bottom:10px;display:flex;gap:12px;font-size:12px;color:var(--tx2);pointer-events:none;z-index:1;flex-wrap:wrap}
.mem-side{width:var(--ms,380px);flex:none;background:var(--panel);overflow:auto;padding:14px;border-left:1px solid var(--line)}
.mem-body>.split.v{background:var(--panel);margin-right:-1px}
.mem-fab{position:absolute;right:14px;bottom:12px;display:flex;gap:8px;z-index:2}
.mem-fab .tog{background:rgba(11,15,34,.75);backdrop-filter:blur(4px);padding:4px 12px;font-size:13px}
.mem-fab #memIn,.mem-fab #memOut{width:32px;padding:4px 0;font-size:15px;line-height:1.2}
.mem-fab .tog.on{background:rgba(122,176,255,.22)}
.mem-legend .dotc{box-shadow:0 0 6px currentColor}
.mem-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mem-fold{margin-left:auto}
.ms-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;margin:16px 0 6px;cursor:pointer;color:var(--tx)}
.ms-h:hover{color:var(--ac)}
.mn{border:1px solid var(--line);border-radius:10px;padding:7px 10px 9px;margin-bottom:8px;cursor:pointer;background:var(--panel2);transition:border-color .15s,box-shadow .15s}
.mn:hover{border-color:var(--line2)}
.mn.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 0 22px rgba(122,176,255,.28)}
.mn-body{font-size:13px;color:var(--tx2);margin-top:3px;white-space:pre-wrap;line-height:1.6}
.mn-src{font-size:12px;color:var(--tx3);margin-top:4px}
.mem-h{font-size:16px;font-weight:500;margin:2px 0 4px;display:flex;align-items:center}
.mem-stance{display:flex;gap:14px;font-size:13px}
.mem-it{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px dashed var(--line);padding:7px 2px;cursor:pointer;font-size:13px;color:var(--tx)}
.mem-it:hover{background:var(--panel2)}
.mem-back{margin-bottom:8px}
.mem-time{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel);flex:none;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.mem-time input{flex:1;accent-color:var(--ac);min-width:0}
.ctag{font-size:11px;padding:0 6px;border-radius:4px;background:var(--panel2);color:var(--tx2);line-height:18px;white-space:nowrap;border:1px solid var(--line)}
.ctag.ai{color:#C026D3;border-color:rgba(232,121,249,.5);background:rgba(232,121,249,.1)}
:root[data-theme="dark"] .ctag.ai,dialog.mem .ctag.ai{color:#F0ABFC}
.ctag.strat{color:var(--ac);border-color:var(--ac);background:var(--acbg)}
.nt-top.wrap{flex-wrap:wrap}
.nt-meta{font-size:12px;color:var(--tx2);margin-top:2px}
.nt-meta .an{color:var(--tx);font-weight:500}
.rel{font:inherit;font-size:12px;background:transparent;border:0;padding:0;color:var(--ac);cursor:pointer}
span.rel{color:var(--tx2);cursor:default}
.nfil{display:flex;gap:8px;align-items:center;margin:0 0 6px;flex-wrap:wrap}
.nfil select{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:3px 8px;font-size:12px;color:var(--tx)}
.chip2 .dotc{width:7px;height:7px;margin-right:5px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
.dlg{display:flex;flex-direction:column;max-height:90dvh}
.dlg-h{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.dlg-b{padding:14px;overflow:auto}
.dlg-f{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.fld label,.lbl{font-size:12px;color:var(--tx2)}
.fld .hint{font-size:12px;color:var(--tx3)}
.fld input,.fld select,.fld textarea{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:7px 10px;width:100%;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--ac)}
.fld input[readonly]{color:var(--tx2)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inl{display:flex;gap:6px}
.seg{display:inline-flex;background:var(--panel2);border-radius:8px;padding:2px;margin-bottom:12px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:5px 16px;border-radius:6px;cursor:pointer;color:var(--tx2);font-size:13px}
.seg input:checked+span{background:var(--panel);color:var(--tx);box-shadow:0 0 0 1px var(--line)}
.pv{background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.err{color:var(--red);font-size:13px;min-height:0}
.err:not(:empty){margin-top:8px}
.gset{border:1px solid var(--line);border-radius:10px;padding:12px 12px 2px;margin-bottom:12px}
.gset>.lbl{display:block;font-weight:500;color:var(--tx);font-size:13px;margin-bottom:10px}
.chk-l{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px;font-size:13px}
.chk-l li{display:flex;gap:8px;align-items:flex-start;line-height:1.45}
.chk-i{flex:none;width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px;background:var(--panel2);color:var(--tx2)}
.chk-ok .chk-i{background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--ac)}
.chk-warn .chk-i{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.chk-err .chk-i{background:#e5484d;color:#fff}
.chk-err b{color:#e5484d}
.keyline{display:block;padding:8px 10px;border-radius:8px;background:var(--panel2);font-size:12px;word-break:break-all;user-select:all}
/* 新欄位標籤、依據連結 */
.ctag.warn{color:var(--warn);border-color:rgba(227,160,8,.45);background:rgba(227,160,8,.08)}
.ctag.ok{color:var(--green);border-color:rgba(46,189,133,.45);background:rgba(46,189,133,.08)}
.ctag.old{color:var(--tx3);border-style:dashed}
.nt.old{opacity:.62}
.nt-links{font-size:12px;color:var(--tx2);margin-top:4px;display:none}
.nt.open .nt-links{display:block}
.mn .nt-links{display:block}
.lnk{font:inherit;font-size:12px;background:transparent;border:0;padding:0 2px;color:var(--ac);cursor:pointer;text-align:left}
.lnk:hover{text-decoration:underline}
.adv{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:12px}
.adv summary{cursor:pointer;font-size:13px;color:var(--tx2)}
.adv[open] summary{margin-bottom:10px}
.evl{display:flex;flex-direction:column;gap:4px;font-size:13px;margin-bottom:10px}
.evl label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.qst{font:inherit;font-size:12px;color:var(--tx2);background:transparent;border:0;padding:0;cursor:pointer}
.qst b{font-weight:500;color:var(--tx);margin-left:4px}
.qst b.r{color:var(--red)}.qst b.g{color:var(--green)}
.qst:hover{color:var(--tx)}
/* 多空指標 */
.sblk{border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin:0 0 8px;font-size:12px}
.sblk-h{display:flex;align-items:center;gap:8px;color:var(--tx2);margin-bottom:2px}
.sblk-h b{color:var(--tx);font-weight:500}
.sblk select,.mg-sum select{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:1px 4px;font-size:12px;color:var(--tx)}
.srow{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;padding:3px 0}
.slab{width:76px;flex:none;color:var(--tx2)}
.sbar{display:inline-flex;width:110px;height:7px;border-radius:4px;overflow:hidden;background:var(--line);flex:none}
.sbar i{display:block;height:100%}
.sbar.sm{width:54px;height:5px}
.snum{color:var(--tx2);white-space:nowrap}
.sratio{white-space:nowrap;color:var(--tx2)}
.sratio b{color:var(--tx);font-weight:500}
.mini{display:inline-flex;align-items:center;gap:6px;float:right;font-size:12px;color:var(--tx2)}
.seg2{display:inline-flex;gap:2px;background:var(--panel2);border-radius:8px;padding:2px}
.seg2 button{border:0;background:transparent;padding:2px 10px;border-radius:6px;cursor:pointer;color:var(--tx2);font-size:12px;white-space:nowrap}
.seg2 button.on{background:var(--panel);color:var(--tx);box-shadow:0 0 0 1px var(--line)}
.anl{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.anl td{padding:3px 4px;border-bottom:1px dashed var(--line);white-space:nowrap}
.anl td:first-child{white-space:normal}
.anl td.anr{text-align:right;color:var(--tx2)}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:12px}
.toast .tact{font:inherit;font-size:13px;font-weight:500;background:transparent;border:0;color:var(--ac);cursor:pointer;padding:0}
:root[data-theme="dark"] .toast .tact{color:#2563EB}
/* 資料整理 */
dialog.mgr{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;border:0;border-radius:0;padding:0;background:var(--bg)}
dialog.mgr[open]{display:flex;flex-direction:column}
.mg-top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;padding-top:max(8px,env(safe-area-inset-top))}
.mg-top b{font-weight:500;font-size:15px}
.mg-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 14px 0;gap:8px}
.mg-fil{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;flex:none}
.mg-fil select,.mg-fil input,.mg-tools select{background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:4px 8px;font-size:13px;color:var(--tx);max-width:200px;min-width:0}
.mg-fil input[type=search]{width:200px}
.mg-fil input[type=date]{width:140px}
.mg-fil .chk{margin:0;font-size:12px}
.mg-sum{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:var(--tx2);flex:none}
.mg-sum .sblk{margin:0;border:0;padding:0}
.mg-sum .srow{padding:0}
.mg-grid{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mg-head,.mg-r{display:grid;grid-template-columns:30px 122px 86px minmax(130px,1.1fr) minmax(180px,2.4fr) 52px 52px minmax(70px,.6fr) 92px;align-items:center;column-gap:8px;padding:0 10px}
.mg-head{font-size:12px;color:var(--tx2);border-bottom:1px solid var(--line);height:34px;flex:none}
.mg-head [data-sort]{cursor:pointer;user-select:none}
.mg-head [data-sort]:hover{color:var(--tx)}
.mg-head .on{color:var(--ac)}
.mg-vp{flex:1;overflow:auto;position:relative;min-height:0}
.mg-sp{position:relative;width:100%}
.mg-r{position:absolute;left:0;right:0;height:36px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.mg-r:hover{background:var(--panel2)}
.mg-r.on{background:var(--acbg)}
.mg-r>*{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg-r .tt{display:flex;align-items:center;gap:6px}
.mg-r .tt span{overflow:hidden;text-overflow:ellipsis}
.mg-r .ctag{flex:none}
.mg-r .st2{display:flex;gap:4px}
.mg-g{position:absolute;left:0;right:0;height:36px;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--panel2);font-size:12px;color:var(--tx2);border-bottom:1px solid var(--line)}
.mg-g b{color:var(--tx);font-weight:500}
.mg-act{display:none;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0 10px;flex:none}
.mg-act.on{display:flex}
.mg-act b{font-weight:500;margin-right:4px}
.mg-act select{background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:4px 8px;font-size:13px}
.mg-foot{flex:none;height:10px}
.mg-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--tx2);font-size:13px;padding:20px;text-align:center}
.mg-scroll{flex:1;min-height:0;overflow:auto;padding-bottom:14px}
.mg-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:none;font-size:13px}
.ct{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.ct-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:500;font-size:14px;padding:2px 0 6px}
.ct-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 0;border-top:1px dashed var(--line);font-size:13px}
.ct-r label{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.ct-r .faint{font-size:12px}
.ih{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.ih .sp{min-width:8px}
.ih.done{opacity:.6}
.pk{max-height:46dvh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:0 10px}
.mg-ftog{display:none}
/* 新聞 */
.ctag.ann{color:var(--ac);border-color:var(--ac);background:var(--acbg)}
.tabs button .n.nwn{color:var(--ac);font-weight:500}
.nw{border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:8px}
.nw.sel{border-color:var(--ac);background:var(--acbg)}
.nw.dismissed,.nw.added{opacity:.7}
.nw .nt-top input{margin:0}
.nw-src{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.nw-t{display:block;font-weight:500;color:var(--tx);text-decoration:none;margin-top:2px}
a.nw-t:hover{color:var(--ac);text-decoration:underline}
.nw-more{font-size:12px;color:var(--tx2);margin-top:4px}
.nw-more summary{cursor:pointer}
.nw-more div{padding:2px 0 2px 12px}
.nw-more a{color:var(--tx2)}
.nw-act{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.nw-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--panel2);border-radius:8px;padding:6px 8px;margin-bottom:8px;position:sticky;top:-10px;z-index:1}
.nw-bar b{font-weight:500;margin-right:4px}
.mg-head.nwh,.mg-r.nwr{grid-template-columns:30px 100px 86px 46px 110px minmax(200px,3fr) 130px 70px}
.mg-r.nwr a{color:var(--tx);text-decoration:none}
.mg-r.nwr a:hover{color:var(--ac);text-decoration:underline}
.mg-r.old{opacity:.6}
/* 公司資料與財報 */
.cohead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cohead b{font-size:15px;font-weight:500}
.colinks{display:flex;gap:6px;flex-wrap:wrap}
.colinks .btn{font-size:12px;padding:2px 8px;text-decoration:none;color:var(--tx)}
.cosec{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel)}
.cosec>summary{cursor:pointer;padding:8px 12px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;list-style:none;user-select:none}
.cosec>summary::-webkit-details-marker{display:none}
.cosec>summary::before{content:'▸';color:var(--tx3);display:inline-block;transition:transform .15s}
.cosec[open]>summary::before{transform:rotate(90deg)}
.cosec-b{padding:0 12px 10px;min-width:0}
.cosec .note{margin-top:4px}
:root[data-theme="dark"]{--fc1:#3987e5;--fc1m:#24548f;--fc2:#d95926;--fc3:#199e70;--fchv:rgba(255,255,255,.045)}
:root[data-theme="light"]{--fc1:#2a78d6;--fc1m:#9ec5f4;--fc2:#eb6834;--fc3:#1baf7a;--fchv:rgba(15,20,30,.045)}
.fch-w{margin:2px 0 4px}
.fch{position:relative;margin:2px 0 8px;min-width:0}
.fch svg{display:block;overflow:visible;outline:none;touch-action:pan-y}
.fch svg:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
.fch-h{display:flex;align-items:baseline;gap:8px;font-size:12px;margin-bottom:4px;flex-wrap:wrap}
.fch-t{color:var(--tx);font-weight:500}.fch-u{color:var(--tx3)}
.fk{display:inline-flex;align-items:center;gap:5px;color:var(--tx2)}.fk i{width:12px;height:2px;border-radius:1px;display:inline-block}
.fch .fg{stroke:var(--line);stroke-width:1}.fch .fz{stroke:var(--line2);stroke-width:1}
.fch .ft{font-size:11px;fill:var(--tx3);font-variant-numeric:tabular-nums}.fch .ft.fcur{fill:var(--tx2)}
.fch .fv{font-size:11px;fill:var(--tx);font-variant-numeric:tabular-nums}
.fch .fb{fill:var(--fc1m);transition:fill .12s}.fch .fb.hl,.fch .fb.on{fill:var(--fc1)}
.fch .fs{opacity:.55;transition:opacity .12s}.fch .fs.hl,.fch .fs.on{opacity:1}
.fch .fl{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.fch .fdot{stroke:var(--panel);stroke-width:2}
.fch .fx{stroke:var(--tx3);stroke-width:1}
.fch .fhb{fill:var(--fchv)}
.fch-tip{position:absolute;z-index:5;pointer-events:none;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px var(--shade);min-width:110px;white-space:nowrap}
.fch-tt{color:var(--tx2);margin-bottom:3px}
.fch-tr{display:flex;align-items:center;gap:6px;line-height:1.55}.fch-tr b{font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}.fch-tr span{color:var(--tx2)}
.fch-tr i.kl{width:10px;height:2px;border-radius:1px;display:inline-block}
.fch-m{margin:0 0 8px}
.fch-tr i.kb{width:8px;height:8px;border-radius:2px;display:inline-block}
/* 解鎖畫面 */
html.locked body>*:not(#lock):not(dialog){visibility:hidden}
.lock{position:fixed;inset:0;z-index:1000;background:var(--bg);display:grid;place-items:center;padding:16px}
.lock[hidden]{display:none}
.lock-box{width:min(360px,100%);display:flex;flex-direction:column;align-items:stretch;gap:10px;text-align:center}
.lock-box h2{margin:4px 0 0;font-size:20px;font-weight:600}
.lock-box p{margin:0 0 6px;font-size:13px}
.lock-ic{margin:0 auto;width:56px;height:56px;border-radius:16px;background:var(--panel2);display:grid;place-items:center;color:var(--ac)}
.lock-ic .ic{width:28px;height:28px}
.lock-in{font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);text-align:center}
.lock-go{padding:10px;font-size:15px;justify-content:center;text-align:center}
.ibtn[hidden]{display:none!important}
.lock .err{min-height:18px;color:var(--red);font-size:13px}
.lock .lnk{align-self:center}
.keyline.rc{font-size:18px;letter-spacing:.06em;text-align:center;padding:12px}
:root[data-theme="dark"]{--fc4:#c98500;--fc5:#d55181}
:root[data-theme="light"]{--fc4:#eda100;--fc5:#e87ba4}
/* 資產畫面 */
.as-wrap{flex:1;min-height:0;display:flex}
.as-main{flex:1;min-width:0;overflow:auto;padding:12px 14px}
.as-dr{width:380px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow:auto;display:flex;flex-direction:column}
.as-dr-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.as-dr-b{padding:10px 12px}
.as-kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px}
.as-kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0}
.as-kv b{font-weight:500;font-variant-numeric:tabular-nums}
.as-news{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px}
.as-news a{color:var(--tx);text-decoration:none}.as-news a:hover{text-decoration:underline}
.as-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.as-tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.as-tile .k{font-size:12px;color:var(--tx2)}.as-tile .v{font-size:18px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-tile.hero .v{font-size:22px}.as-tile .d{font-size:12px}
.as-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;margin-bottom:12px;align-items:start}
.as-card{padding:12px;margin-bottom:12px}.as-grid .as-card{margin-bottom:0}
.as-h{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px;color:var(--tx);margin-bottom:8px;flex-wrap:wrap}
.as-h select,.as-set select,.as-set input{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:3px 8px;font-size:12px;color:var(--tx)}
.as-seg{display:flex;gap:2px;height:28px;border-radius:4px;overflow:hidden}
.as-seg-b{min-width:2px;display:flex;align-items:center;padding-left:6px;border-radius:4px}
.as-seg-b span{font-size:12px;font-weight:600;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.35)}
.as-leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.as-sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.as-hl{display:grid;gap:2px}
.as-hr{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(60px,2fr) minmax(96px,auto);gap:10px;align-items:center;border:0;background:transparent;color:inherit;text-align:left;padding:6px 6px;border-radius:6px;cursor:pointer;font:inherit}
.as-hr:hover{background:var(--panel2)}
.as-hn{display:flex;flex-direction:column;min-width:0}.as-hn b{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-hb{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}.as-hb i{display:block;height:100%;background:var(--fc1);border-radius:4px}
.as-hv{display:flex;flex-direction:column;align-items:flex-end;font-size:13px;font-variant-numeric:tabular-nums}
.as-acct{border-top:1px solid var(--line)}.as-acct:first-of-type{border-top:0}
.as-acct.closed{opacity:.6}
.as-acct-h{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:inherit;padding:8px 4px;cursor:pointer;font:inherit;text-align:left}
.as-acct-h:hover{background:var(--panel2);border-radius:6px}
.as-acct-n{flex:1;display:flex;flex-direction:column;min-width:0}.as-acct-n b{font-weight:500}
.as-acct-v{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.as-acct-b{padding:4px 4px 10px}
.as-rb{width:62px;padding-left:0!important;padding-right:0!important;white-space:nowrap}
td.neg{color:var(--tx2)}
.as-set{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:13px}
.as-picks{display:grid;gap:6px}
.as-pick{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.as-pick:has(input:checked){border-color:var(--ac)}
button.lnk{border:0;background:none;padding:0;color:var(--tx);cursor:pointer;font:inherit;text-align:left}button.lnk:hover{text-decoration:underline}
@media (max-width:899px){
  .as-tiles{grid-template-columns:1fr 1fr}
  .as-grid{grid-template-columns:1fr}
  .as-main{padding:8px}
  .as-dr{position:fixed;inset:auto 0 0 0;width:auto;max-height:78dvh;border-left:0;border-top:1px solid var(--line2);border-radius:14px 14px 0 0;box-shadow:0 -8px 24px var(--shade);z-index:3;padding-bottom:env(safe-area-inset-bottom)}
  .as-hr{grid-template-columns:minmax(0,1.3fr) minmax(40px,1fr) auto}

<script>
'use strict';

/* ========== 基本資料與儲存 ========== */
const APP_VERSION = '2026.11.07';
const LS = { data: 'st.data', conf: 'st.conf', quotes: 'st.quotes', ui: 'st.ui' };
const $ = s => document.querySelector(s);

function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.warn('儲存失敗', e); } }

function defaultSettings() {
  return {
    apiUrl: '', apiKey: '', refreshSec: 10, groupByMarket: true,
    twFeeRate: 0.001425, twFeeDiscount: 1, twFeeMin: 20, twFeeMinOdd: 1,
    twTaxStock: 0.003, twTaxEtf: 0.001,
    usFee: 0, usSellRate: 0
  };
}
const TRASH_DAYS = 30;                                   // 回收桶保留天數
const DATA_ARRAYS = ['stocks', 'trades', 'dividends', 'notes', 'strategies', 'imports', 'trash', 'tombs', 'dupIgnore', 'accounts', 'acctTx', 'acctBal', 'divSkip'];
// imports：匯入紀錄；trash：回收桶；tombs：刪過的重點（再匯入時提醒）；dupIgnore：標為「不是重複」的組合
// newsAct：新聞的處理狀態 { 新聞編號: 'd'（略過）| 'a:重點編號'（已加入）}
// accounts：資產帳戶；acctTx：帳戶進出（ref 連到交易 t:、股利 d:、轉帳 x:）；acctBal：記下的餘額；divSkip：刪掉、不要再自動算的配息
function emptyData() { return { version: 1, updatedAt: 0, settings: defaultSettings(), stocks: [], trades: [], dividends: [], notes: [], strategies: [], imports: [], trash: [], tombs: [], dupIgnore: [], accounts: [], acctTx: [], acctBal: [], divSkip: [], newsAct: {} }; }
function normalize(d) {
  const o = Object.assign(emptyData(), d || {});
  o.settings = Object.assign(defaultSettings(), (d && d.settings) || {});
  DATA_ARRAYS.forEach(k => { if (!Array.isArray(o[k])) o[k] = []; });
  if (!o.newsAct || typeof o.newsAct !== 'object' || Array.isArray(o.newsAct)) o.newsAct = {};
  o.notes.forEach(n => { if (n.topic === '產品') n.topic = '產品業務'; });   // 舊版主題改名
  const cut = Date.now() - TRASH_DAYS * 864e5;
  o.trash = o.trash.filter(x => x && x.item && (x.at || 0) >= cut);
  if (o.tombs.length > 8000) o.tombs = o.tombs.slice(-8000);
  if (o.dupIgnore.length > 20000) o.dupIgnore = o.dupIgnore.slice(-20000);
  if (o.imports.length > 300) o.imports = o.imports.slice(-300);
  return o;
}

// 資料主要存在瀏覽器的資料庫（IndexedDB，容量大）；localStorage 放得下時也存一份，開啟時比較快
let data = normalize(load(LS.data));
const DATA0 = data;
const DIV = { timer: 0, busy: false };   // 配息自動計算的狀態（commit 會用到，所以放前面）
let conf = Object.assign({ theme: 'dark', token: '', repo: '', dirty: false, syncedAt: 0 }, load(LS.conf) || {});
let quotes = Object.assign({ tw: {}, us: {}, fx: null, time: 0 }, load(LS.quotes) || {});
let ui = Object.assign({ tab: 'hold', sel: null, kInt: '1d', kTrades: true, kNotes: true, noteTopic: '', memFold: false, memSpin: false, hiWin: 250, statRange: 0 }, load(LS.ui) || {});
ui.noteHl = new Set(); ui.noteOpen = new Set();
let qState = { status: 'idle', msg: '' };
let syncState = { status: conf.token ? 'idle' : 'off', msg: '', at: 0 };

/* ---- 密碼保護：資料用 AES-256-GCM 加密 ----
   一把隨機的「資料金鑰」加密所有資料；資料金鑰再分別用「密碼」和「救援碼」包起來（PBKDF2-SHA256）。
   換密碼只要重新包資料金鑰。這台裝置和 GitHub 上存的都是加密後的內容。 */
const VAULT = { on: !!load('st.vault'), hdr: load('st.vault'), dek: null, seq: 0, pending: Promise.resolve(), last: Date.now(), hiddenAt: 0 };
const te = s => new TextEncoder().encode(s), td = b => new TextDecoder().decode(b);
const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rndB = n => crypto.getRandomValues(new Uint8Array(n));
const PBKDF2_IT = 600000, RC_IT = 100000;
async function kdf(secret, salt, it) {
  const base = await crypto.subtle.importKey('raw', te(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
const aad = kid => ({ additionalData: te('st|' + kid) });
async function aesEnc(key, bytes, kid) { const iv = rndB(12); const ct = new Uint8Array(await crypto.subtle.encrypt(Object.assign({ name: 'AES-GCM', iv }, aad(kid)), key, bytes)); return { iv: b64e(iv), ct: b64e(ct) }; }
async function aesDec(key, o, kid) { return new Uint8Array(await crypto.subtle.decrypt(Object.assign({ name: 'AES-GCM', iv: b64d(o.iv) }, aad(kid)), key, b64d(o.ct))); }
const importDek = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
// 救援碼：25 個字（Crockford base32，不會有 0/O、1/I/L 分不清的問題）
const RC_A = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function newRc() { const b = rndB(25); return [...b].map(x => RC_A[x % 32]).join('').replace(/(.{5})(?!$)/g, '$1-'); }
const normRc = s => String(s || '').toUpperCase().replace(/[\s\-]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1');
const normPw = s => String(s || '').normalize('NFKC');
// 用密碼或救援碼打開資料金鑰
async function unwrapDek(hdr, secret, useRc) {
  const w = useRc ? hdr.r : hdr.p;
  const k = await kdf(useRc ? normRc(secret) : normPw(secret), b64d(w.salt), w.it);
  return aesDec(k, w.w, hdr.kid);          // 錯的話會丟出錯誤
}
async function wrapPart(raw, secret, it, kid) { const salt = rndB(16); const k = await kdf(secret, salt, it); return { salt: b64e(salt), it, w: await aesEnc(k, raw, kid) }; }
// 加密的儲存（IndexedDB）：鍵名也打亂，看不出存了哪些股票
async function sKey(k) { if (!VAULT.on || !VAULT.dek) return k; const h = new Uint8Array(await crypto.subtle.digest('SHA-256', te(VAULT.hdr.kid + '|' + k))); return 'x:' + [...h.slice(0, 16)].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function sGet(k) {
  if (VAULT.on && !VAULT.dek) return undefined;
  const v = await idbGet(await sKey(k));
  if (!VAULT.on || v == null) return v;
  try { return JSON.parse(td(await aesDec(VAULT.dek, v, VAULT.hdr.kid))); } catch (e) { return undefined; }
}
async function sSet(k, v) {
  if (VAULT.on && !VAULT.dek) return false;
  if (!VAULT.on) return idbSet(k, v);
  return idbSet(await sKey(k), await aesEnc(VAULT.dek, te(JSON.stringify(v)), VAULT.hdr.kid));
}
async function vaultEnc(text) { return aesEnc(VAULT.dek, te(text), VAULT.hdr.kid); }
async function vaultDec(o) { return td(await aesDec(VAULT.dek, o, VAULT.hdr.kid)); }
// 雲端／備份檔的格式：外面只看得到格式和金鑰編號，看不到內容（也故意不放 updatedAt，舊版網頁會當作沒變）
async function vaultEnvelope(text) { const e = await vaultEnc(text); return JSON.stringify({ st_vault: 1, kid: VAULT.hdr.kid, hv: VAULT.hdr.hv || 0, p: VAULT.hdr.p, r: VAULT.hdr.r, iv: e.iv, ct: e.ct }); }
const isEnvelope = o => !!(o && o.st_vault && o.kid && o.p && o.ct);
if (VAULT.on) document.documentElement.classList.add('locked');
const STORE = { ok: true, ls: true };
function saveData() {
  const json = JSON.stringify(data);
  if (VAULT.on) {
    if (!VAULT.dek) return;                       // 還沒解鎖：什麼都不寫
    const seq = ++VAULT.seq;
    VAULT.pending = vaultEnc(json).then(async e => {
      if (seq !== VAULT.seq) return;              // 後面還有更新的要存
      const t = JSON.stringify(e);
      try { localStorage.setItem(LS.data, t); STORE.ls = true; localStorage.removeItem('st.data.idb'); }
      catch (err) { STORE.ls = false; try { localStorage.removeItem(LS.data); localStorage.setItem('st.data.idb', '1'); } catch (e2) { /* 略過 */ } }
      const ok = await idbSet('data', t); const was = STORE.ok; STORE.ok = ok || STORE.ls; if (was !== STORE.ok) renderBanner();
    }).catch(() => {});
    return;
  }
  try { localStorage.setItem(LS.data, json); STORE.ls = true; localStorage.removeItem('st.data.idb'); }
  catch (e) { STORE.ls = false; try { localStorage.removeItem(LS.data); localStorage.setItem('st.data.idb', '1'); } catch (e2) { /* 略過 */ } }
  idbSet('data', json).then(ok => { const was = STORE.ok; STORE.ok = ok || STORE.ls; if (was !== STORE.ok) renderBanner(); });
}
/* ---- 瀏覽器資料庫（IndexedDB）：一個簡單的鍵值儲存 ---- */
const IDB = { p: null };
function idb() {
  if (IDB.p) return IDB.p;
  IDB.p = new Promise(res => {
    try {
      const r = indexedDB.open('stock-tracker', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
      r.onblocked = () => res(null);
    } catch (e) { res(null); }
  });
  return IDB.p;
}
async function idbGet(k) {
  const db = await idb(); if (!db) return undefined;
  return new Promise(res => { try { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); } catch (e) { res(undefined); } });
}
async function idbSet(k, v) {
  const db = await idb(); if (!db) return false;
  return new Promise(res => { try { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); t.onabort = () => res(false); } catch (e) { res(false); } });
}
// 開啟時：資料庫裡的比較新（或 localStorage 放不下）就用資料庫的；第一次使用時把舊資料搬過去
async function idbLoadData() {
  if (VAULT.on) return false;                     // 加密的資料在解鎖時讀
  const s = await idbGet('data');
  if (typeof s === 'string') {
    let d = null; try { d = JSON.parse(s); } catch (e) { d = null; }
    if (d && data === DATA0 && (d.updatedAt || 0) >= (data.updatedAt || 0) && (d.updatedAt || d.stocks)) { data = normalize(d); return true; }
  } else if (!VAULT.on && data === DATA0 && (data.stocks.length || data.notes.length)) idbSet('data', JSON.stringify(data));
  return false;
}
function saveConf() { if (VAULT.on) { saveConfVault(); return; } store(LS.conf, conf); }
function saveUi() { store(LS.ui, { tab: ui.tab, sel: ui.sel, kInt: ui.kInt, kTrades: ui.kTrades, kNotes: ui.kNotes, noteTopic: ui.noteTopic, memFold: ui.memFold, memSpin: ui.memSpin, hiWin: ui.hiWin, statRange: ui.statRange }); }

function commit(markDirty = true) {
  data.updatedAt = Date.now();
  saveData();
  if (markDirty && !data.demo) { conf.dirty = true; saveConf(); scheduleSync(); }
  render();
  if (MG.open) mgRender();
  if (!DIV.busy) divSchedule();
  if (data.settings.apiUrl && !data.demo && newsWatchSig() !== conf.newsSig) scheduleNewsWatch();
}
// 資料整理畫面的狀態
const MG = { open: false, tab: 'notes', f: {}, sort: { k: 'date', d: -1 }, sel: new Set(), list: [], rows: [], dup: false, groups: null, last: -1, catStock: '', catSel: new Set(), tsel: new Set(), showFil: false };

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function today() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }

/* ========== 格式 ========== */
const NF = {};
function nf(d) { return NF[d] || (NF[d] = new Intl.NumberFormat('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d })); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const isNum = v => typeof v === 'number' && isFinite(v);
const curOf = st => st.market === 'TW' ? 'TWD' : 'USD';
function fmtPrice(v) { return isNum(v) ? nf(2).format(v) : '—'; }
function fmtMoney(v, cur) { if (!isNum(v)) return '—'; return cur === 'USD' ? nf(2).format(v) : nf(0).format(Math.round(v)); }
function fmtSigned(v, cur) { if (!isNum(v)) return '—'; const s = fmtMoney(Math.abs(v), cur); return (v > 0.0049 ? '+' : v < -0.0049 ? '−' : '') + s; }
function fmtPct(v) { if (!isNum(v)) return '—'; const p = v * 100; return (p > 0.0049 ? '+' : p < -0.0049 ? '−' : '') + Math.abs(p).toFixed(2) + '%'; }
function curSym(cur) { return cur === 'USD' ? 'US$' : 'NT$'; }
function fmtShares(n, market) {
  if (!isNum(n)) return '—';
  if (market === 'TW') {
    const lots = Math.floor(n / 1000), odd = Math.round(n % 1000);
    if (lots && odd) return `${lots} 張 ${odd} 股`;
    if (lots) return `${lots} 張`;
    return `${odd} 股`;
  }
  return `${+n.toFixed(4)} 股`;
}
function fmtVol(v, market) {
  if (!isNum(v)) return '—';
  if (market === 'TW') return nf(0).format(v) + ' 張';
  if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return String(v);
}
// 台股紅漲綠跌、美股綠漲紅跌

function marketOpen(tz, from, to) {
  const parts = {};
  new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short', hour: 'numeric', minute: 'numeric', hour12: false })
    .formatToParts(new Date()).forEach(p => parts[p.type] = p.value);
  if (parts.weekday === 'Sat' || parts.weekday === 'Sun') return false;
  const m = (parseInt(parts.hour, 10) % 24) * 60 + parseInt(parts.minute, 10);
  return m >= from && m < to;
}

let fetching = false;
async function fetchQuotes(codesOverride) {
  const s = data.settings;
  if (!s.apiUrl) return null;
  const tw = codesOverride ? codesOverride.tw || [] : [...new Set(data.stocks.filter(x => x.market === 'TW').map(x => x.code))];
  const us = codesOverride ? codesOverride.us || [] : [...new Set(data.stocks.filter(x => x.market === 'US').map(x => x.code))];
  if (!tw.length && !us.length && !codesOverride) return null;
  let u;
  try { u = new URL(s.apiUrl); } catch (e) { qState = { status: 'err', msg: '報價來源網址格式不對' }; renderStatus(); return null; }
  if (tw.length) u.searchParams.set('tw', tw.join(','));
  if (us.length) u.searchParams.set('us', us.join(','));
  u.searchParams.set('fx', '1');
  if (s.apiKey) u.searchParams.set('key', s.apiKey);
  if (codesOverride) {
    const r = await fetch(u.toString());
    return r.json();
  }
  if (fetching) return null;
  fetching = true; qState.status = 'busy'; renderStatus();
  try {
    const r = await fetch(u.toString());
    const j = await r.json();
    if (j.error) throw new Error(j.error === 'unauthorized' ? '存取密語不正確' : j.error);
    Object.assign(quotes.tw, j.tw || {});
    Object.assign(quotes.us, j.us || {});
    if (isNum(j.fx)) quotes.fx = j.fx;
    quotes.time = j.time || Date.now();
    if (VAULT.on) sSet('quotes', quotes); else store(LS.quotes, quotes);
    let changed = false;
    data.stocks.forEach(st => {
      const q = st.market === 'TW' ? (j.tw || {})[st.code] : (j.us || {})[st.code];
      if (!q) return;
      if (st.market === 'TW' && q.ex && st.exch !== q.ex) { st.exch = q.ex; changed = true; }
      if (!st.name && q.name) { st.name = q.name; changed = true; }
    });
    const errs = (j.errors || []).filter(e => !/^twse:/.test(e));
    qState = { status: errs.length ? 'warn' : 'ok', msg: errs.map(e => e.replace(/^(tw|us) not found: /, '找不到 ')).join('、') };
    fetching = false;
    if (changed) commit(); else render();
  } catch (e) {
    fetching = false;
    qState = { status: 'err', msg: '報價抓取失敗：' + e.message };
    renderStatus();
  }
  return null;
}

/* ========== 費用與損益 ========== */
const isEtf = st => st.market === 'TW' && (st.type === 'ETF' || /^00/.test(st.code));
function autoFee(st, side, shares, price) {
  const s = data.settings;
  const amt = (+shares || 0) * (+price || 0);
  if (!amt) return { fee: 0, tax: 0 };
  if (st.market === 'TW') {
    const min = shares >= 1000 ? +s.twFeeMin : +s.twFeeMinOdd;
    const fee = Math.max(min, Math.floor(amt * s.twFeeRate * s.twFeeDiscount));
    const tax = side === 'sell' ? Math.floor(amt * (isEtf(st) ? s.twTaxEtf : s.twTaxStock)) : 0;
    return { fee, tax };
  }
  const fee = (+s.usFee || 0) + (side === 'sell' ? amt * (+s.usSellRate || 0) : 0);
  return { fee: Math.round(fee * 100) / 100, tax: 0 };
}
function estSell(st, shares, price) { return autoFee(st, 'sell', shares, price); }

// 依日期排序；同一天先算買進和配股，再算賣出
const evRank = e => e.k === 't' && e.r.side === 'sell' ? 1 : 0;
function events(st) {
  const ev = [];
  data.trades.forEach(t => { if (t.stockId === st.id) ev.push({ d: t.date, ts: t.ts || 0, k: 't', r: t }); });
  data.dividends.forEach(x => { if (x.stockId === st.id) ev.push({ d: x.date, ts: x.ts || 0, k: 'd', r: x }); });
  return ev.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : (evRank(a) - evRank(b)) || (a.ts - b.ts));
}
// 有沒有哪一筆賣出超過當時的持股
function oversold(st) {
  let sh = 0;
  for (const e of events(st)) {
    if (e.k === 'd') { if (e.r.type === 'stock') sh += +e.r.shares || 0; }
    else if (e.r.side === 'buy') sh += e.r.shares;
    else { if (e.r.shares > sh + 1e-9) return true; sh -= e.r.shares; }
  }
  return false;
}

function calc(st) {
  const ev = events(st);
  let sh = 0, cost = 0, realized = 0, div = 0, fees = 0, taxes = 0;
  for (const e of ev) {
    const r = e.r;
    if (e.k === 't') {
      const amt = r.shares * r.price, fee = +r.fee || 0, tax = +r.tax || 0;
      fees += fee; taxes += tax;
      if (r.side === 'buy') { sh += r.shares; cost += amt + fee; }
      else {
        const n = Math.min(r.shares, sh);
        const out = sh > 0 ? cost / sh * n : 0;
        realized += r.shares * r.price - fee - tax - out;
        cost -= out; sh -= n;
        if (sh < 1e-9) { sh = 0; cost = 0; }
      }
    } else if (r.type === 'stock') { sh += +r.shares || 0; }
    else { div += (+r.amount || 0) - (+r.deduct || 0); }
  }
  const q = getQuote(st);
  const price = q && isNum(q.price) ? q.price : null;
  const prev = q && isNum(q.prev) ? q.prev : null;
  const o = { sh, cost, avg: sh > 0 ? cost / sh : null, realized, div, fees, taxes, price, prev, q, cur: curOf(st), events: ev.length };
  o.chg = price != null && prev != null ? price - prev : null;
  o.chgPct = o.chg != null && prev ? o.chg / prev : null;
  if (sh > 0 && price != null) {
    o.mv = sh * price;
    const e = estSell(st, sh, price);
    o.unreal = o.mv - e.fee - e.tax - cost;
    o.unrealPct = cost > 0 ? o.unreal / cost : null;
    o.day = o.chg != null ? sh * o.chg : null;
  }
  if (isNum(st.target) && st.target > 0) {
    o.toTarget = price != null ? st.target / price - 1 : null;
    if (sh > 0) {
      const e = estSell(st, sh, st.target);
      o.expected = sh * st.target - e.fee - e.tax - cost;
      o.expectedPct = cost > 0 ? o.expected / cost : null;
    }
  }
  o.total = realized + div + (o.unreal || 0);
  return o;
}

    el.innerHTML = `<span>還沒設定報價來源，價格和損益不會顯示。</span><span class="sp"></span><button class="btn" data-act="settings">前往設定</button>`;
  } else el.innerHTML = '';
}

// 持有＝有持股且沒有被手動放到觀察；手動放到觀察的（parked）不列入總覽損益
const isHeld = (st, c) => c.sh > 0 && !st.parked;
function totals(C) {
  const fx = getFx();
  const t = { mv: 0, cost: 0, unreal: 0, day: 0, realDiv: 0, missing: 0, parked: 0, sub: { TW: { mv: 0, unreal: 0, cost: 0 }, US: { mv: 0, unreal: 0, cost: 0 } }, fx };
  data.stocks.forEach(st => {
    const c = C[st.id], k = st.market === 'TW' ? 1 : fx.rate;
    if (st.parked) { if (c.sh > 0) t.parked++; return; }
    t.realDiv += (c.realized + c.div) * k;
    if (c.sh > 0) {
      if (c.mv == null) { t.missing++; return; }
      t.mv += c.mv * k; t.cost += c.cost * k; t.unreal += c.unreal * k;
      if (c.day != null) t.day += c.day * k;
      const sb = t.sub[st.market]; sb.mv += c.mv; sb.unreal += c.unreal; sb.cost += c.cost;
    }
  });
  return t;
}

function renderList(C) {

      const c4 = isHold ? fmtMoney(c.mv, cur) : fmtPrice(st.target);
      const c5 = isHold
        ? `<div class="${cls(c.unreal, m)}">${fmtSigned(c.unreal, cur)}</div><div class="sub ${cls(c.unreal, m)}">${fmtPct(c.unrealPct)}</div>`
        : `<span class="muted">${fmtPct(c.toTarget)}</span>`;
      const mk = grouped ? '' : `<span class="mk">${m === 'TW' ? '台' : '美'}</span>`;
      const parked = st.parked && c.sh > 0 ? `<div class="sub faint">有持股 ${fmtShares(c.sh, m)}・不計入總覽</div>` : '';

        <td class="hdl" data-drag="${st.id}" title="按住拖拉：排序，或拖到上方分頁換區" aria-label="拖拉排序">⠿</td>
        <td class="tl"><div class="nm">${mk}<b>${esc(st.code)}</b><span>${esc(st.name || '')}</span></div>${parked}</td>
        <td class="num">${fmtPrice(c.price)}</td><td class="num">${chg}</td>
        <td class="num hide-m">${c4}</td><td class="num">${c5}</td></tr>`;
    };
    let rows = '';
    if (grouped) {
      ['TW', 'US'].forEach(m => {

        rows += `<tr class="grp"><td colspan="6">${m === 'TW' ? '台股' : '美股'}${gs}</td></tr>` + list.map(row).join('');

      <button class="${isHold ? 'on' : ''}" data-act="tab" data-tab="hold" data-drop="hold">持有<span class="n">${hold.length}</span></button>

    </div><span class="sp"></span><button class="btn" data-act="gpt">ChatGPT 重點</button><button class="btn" data-act="add-stock">${ic('plus')}<span>新增<span class="hide-m">標的</span></span></button></div>

/* ========== 拖拉排序與換區 ========== */
const DRAG = { id: null, active: false, sx: 0, sy: 0, ghost: null, target: null, dirty: false, justDropped: false };
function dragClear() {
  document.querySelectorAll('#p-list .ins-before,#p-list .ins-after,#p-list .dragging,#p-list .drop-on').forEach(e => e.classList.remove('ins-before', 'ins-after', 'dragging', 'drop-on'));
}
function dragEnd(apply) {
  const id = DRAG.id, target = DRAG.target, was = DRAG.active;
  if (DRAG.ghost) DRAG.ghost.remove();
  dragClear();
  document.body.classList.remove('dnd');
  Object.assign(DRAG, { id: null, active: false, ghost: null, target: null });
  if (was) { DRAG.justDropped = true; setTimeout(() => { DRAG.justDropped = false; }, 50); }
  const needRender = DRAG.dirty; DRAG.dirty = false;
  if (was && apply && target) dropOn(id, target);
  else if (needRender) render();
}
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('#p-list .hdl');
  if (!h || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault();
  Object.assign(DRAG, { id: h.dataset.drag, active: false, sx: e.clientX, sy: e.clientY, target: null });
});
document.addEventListener('pointermove', e => {
  if (!DRAG.id) return;
  if (!DRAG.active) {
    if (Math.hypot(e.clientX - DRAG.sx, e.clientY - DRAG.sy) < 5) return;
    const st = data.stocks.find(s => s.id === DRAG.id);
    if (!st) { DRAG.id = null; return; }
    DRAG.active = true;
    document.body.classList.add('dnd');
    DRAG.ghost = document.createElement('div');
    DRAG.ghost.className = 'ghost';
    DRAG.ghost.innerHTML = `<b>${esc(st.code)}</b> ${esc(st.name || '')}`;
    document.body.appendChild(DRAG.ghost);
    const row = document.querySelector(`#p-list tr.row[data-id="${DRAG.id}"]`);
    if (row) row.classList.add('dragging');
  }
  e.preventDefault();
  DRAG.ghost.style.left = e.clientX + 'px'; DRAG.ghost.style.top = e.clientY + 'px';
  dragClear();
  const row0 = document.querySelector(`#p-list tr.row[data-id="${DRAG.id}"]`);
  if (row0) row0.classList.add('dragging');
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const tab = el && el.closest('#p-list [data-drop]');
  const row = el && el.closest('#p-list tr.row');
  const st = data.stocks.find(s => s.id === DRAG.id);
  DRAG.target = null;
  if (tab && tab.dataset.drop !== ui.tab) {
    tab.classList.add('drop-on');
    DRAG.target = { kind: 'tab', tab: tab.dataset.drop };
  } else if (row && row.dataset.id !== DRAG.id && (data.settings.groupByMarket === false || row.dataset.mkt === st.market)) {
    const r = row.getBoundingClientRect(), before = e.clientY < r.top + r.height / 2;
    row.classList.add(before ? 'ins-before' : 'ins-after');
    DRAG.target = { kind: 'row', id: row.dataset.id, before };
  }
  // 靠近邊緣時自動捲動
  const pb = document.querySelector('#p-list .pb');
  if (isMobile()) {
    if (e.clientY < 90) window.scrollBy(0, -10); else if (e.clientY > innerHeight - 60) window.scrollBy(0, 10);
  } else if (pb) {
    const r = pb.getBoundingClientRect();
    if (e.clientY < r.top + 28) pb.scrollTop -= 10; else if (e.clientY > r.bottom - 28) pb.scrollTop += 10;
  }
}, { passive: false });
document.addEventListener('pointerup', () => { if (DRAG.id) dragEnd(true); });
document.addEventListener('pointercancel', () => { if (DRAG.id) dragEnd(false); });
document.addEventListener('click', e => { if (DRAG.justDropped) { e.stopPropagation(); e.preventDefault(); } }, true);

function dropOn(id, target) {
  const st = data.stocks.find(s => s.id === id);
  if (!st) return;
  if (target.kind === 'row') {
    const arr = data.stocks;
    arr.splice(arr.indexOf(st), 1);
    let ti = arr.findIndex(s => s.id === target.id);
    if (ti < 0) ti = arr.length; else if (!target.before) ti++;
    arr.splice(ti, 0, st);
    commit();
    return;
  }
  const c = calc(st);
  ui.sel = st.id; saveUi();
  if (target.tab === 'watch') {
    openDialog({
      title: `把 ${stockLabel(st)} 移到觀察`,
      okText: '確定',
      body: `<div class="note" style="margin:0 0 12px">目前持股 ${fmtShares(c.sh, st.market)}。</div>
        <label class="opt"><input type="radio" name="how" value="sell" checked><span><b>全部賣出</b><br><span class="faint">記一筆賣出交易，股數預先填好全部持股。已實現損益會保留。</span></span></label>
        <label class="opt"><input type="radio" name="how" value="park"><span><b>只移到觀察，不賣</b><br><span class="faint">持股保留，但市值和損益<b>不列入</b>頂部的總覽。之後拖回「持有」就會恢復。</span></span></label>`,
      onOk: f => {
        if (fv(f, 'how') === 'park') { st.parked = true; ui.tab = 'watch'; saveUi(); commit(); setTimeout(() => toast('已移到觀察，不列入總覽損益'), 50); }
        else setTimeout(() => openTrade(st, null, { side: 'sell', shares: c.sh }), 0);
      }
    });
  } else {
    if (st.parked) { delete st.parked; ui.tab = 'hold'; saveUi(); commit(); toast('已移回持有'); }
    else if (c.sh > 0) { ui.tab = 'hold'; saveUi(); render(); }
    else openTrade(st, null, { side: 'buy' });
  }
}

/* ========== K 線圖（canvas） ========== */
function niceStep(raw) {
  if (!(raw > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
}
class KChart {
  constructor(host) {
    this.host = host;
    this.cv = document.createElement('canvas');
    this.cv.className = 'kcv';
    host.prepend(this.cv);
    this.ctx = this.cv.getContext('2d');
    this.bars = []; this.maDefs = []; this.ma = []; this.markers = []; this.lines = []; this.col = {};
    this.n = 100; this.right = 0; this.hover = -1; this.my = null; this.sel = -1; this.unit = '1d'; this.topPad = 40;
    this.w = 0; this.h = 0; this.ptrs = new Map(); this.moved = false; this.pinch = null;
    this.onHover = null; this.onSelect = null;
    this.ro = new ResizeObserver(() => this.resize());
    this.ro.observe(host);
    this.bind();
  }
  destroy() { this.ro.disconnect(); this.cv.remove(); }
  resize() {
    const r = this.host.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    this.w = r.width; this.h = r.height;
    if (!this.w || !this.h) return;
    this.cv.width = Math.round(this.w * dpr); this.cv.height = Math.round(this.h * dpr);
    this.cv.style.width = this.w + 'px'; this.cv.style.height = this.h + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.draw();
  }
  pw() { return Math.max(10, this.w - 62); }
  bw() { return this.pw() / this.n; }
  idxAt(x) {
    if (!this.bars.length) return -1;
    const i = Math.round(this.right + 0.5 - (this.pw() - x) / this.bw());
    return i >= 0 && i < this.bars.length && x <= this.pw() ? i : -1;
  }
  indexAtOrBefore(date) {
    const b = this.bars; let lo = 0, hi = b.length - 1, ans = -1;
    while (lo <= hi) { const mid = (lo + hi) >> 1; if (b[mid].time <= date) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
    return ans;
  }
  setData(bars, show, unit) {
    this.bars = bars; this.unit = unit || '1d';
    this.n = Math.min(show || 120, Math.max(20, bars.length + 6));
    this.right = bars.length - 1 + 3; this.hover = -1; this.sel = -1;
    this.refresh();
  }
  refresh() {
    const c = this.bars.map(b => b.c);
    this.ma = this.maDefs.map(d => {
      const v = new Array(c.length).fill(null); let s = 0;
      for (let i = 0; i < c.length; i++) { s += c[i]; if (i >= d.p) s -= c[i - d.p]; if (i >= d.p - 1) v[i] = s / d.p; }
      return { p: d.p, color: d.color, v };
    });
    this.draw();
  }
  clamp() {
    const n = this.bars.length;
    const minR = Math.min(n - 1, this.n * 0.3), maxR = n - 1 + Math.max(3, this.n * 0.25);
    this.right = Math.max(minR, Math.min(maxR, this.right));
  }
  zoomAt(newN, x) {
    const n = this.bars.length; if (!n) return;
    const i = this.right + 0.5 - (this.pw() - x) / this.bw();
    this.n = Math.max(15, Math.min(Math.max(40, n + 10), newN));
    this.right = i - 0.5 + (this.pw() - x) / this.bw();

/* ========== K 線資料 ========== */
const INT = { '1d': { range: '2y', label: '日K', show: 120 }, '1wk': { range: '10y', label: '週K', show: 104 }, '1mo': { range: 'max', label: '月K', show: 96 } };

const DFMT = {};

}
const r4 = v => Math.round(v * 10000) / 10000;
const packBars = bars => bars.map(b => [b.time, r4(b.o), r4(b.h), r4(b.l), r4(b.c), Math.round(b.v || 0)]);

  const m = new Map();
  raw.forEach(b => {
    if (![b.o, b.h, b.l, b.c].every(isNum)) return;
    const time = dateIn(tz, b.t);
    m.set(time, { time, o: b.o, h: Math.max(b.h, b.o, b.c), l: Math.min(b.l, b.o, b.c), c: b.c, v: b.v || 0 });

  if (VAULT.on) { sSet(key, rec); return; }
  try { localStorage.setItem(key, JSON.stringify(rec)); }
  catch (e) {
    Object.keys(localStorage).filter(k => k.startsWith('st.h.') && k !== key).forEach(k => localStorage.removeItem(k));

const HMEM = {};

async function loadHistory(st, int) {
  if (isDemoStock(st)) return demoBars(st, int);
  const key = `st.h.${st.market}:${st.code}:${int}`;
  const maxAge = int === '1d' ? 15 * 60e3 : 12 * 3600e3;
  const cached = HMEM[key] || (VAULT.on ? await sGet(key) : load(key));
  if (cached && Date.now() - cached.at < maxAge) { HMEM[key] = cached; return unpackBars(cached.b); }
  const s = data.settings;
  if (!s.apiUrl) { if (cached) return unpackBars(cached.b); throw new Error('還沒設定報價來源'); }
  const syms = st.market === 'TW'
    ? (st.exch === 'otc' ? ['.TWO'] : st.exch === 'tse' ? ['.TW'] : ['.TW', '.TWO']).map(x => st.code + x)

  for (const sym of syms) {

      u.searchParams.set('range', INT[int].range); u.searchParams.set('interval', int);
      if (s.apiKey) u.searchParams.set('key', s.apiKey);
      const j = await (await fetch(u.toString())).json();
      if (j.error) { lastErr = j.error === 'unauthorized' ? '存取密語不正確' : j.error === 'no data' ? '查無資料' : j.error; continue; }
      const bars = toBars(j.bars || [], TZ[st.market]);
      if (!bars.length) { lastErr = '查無資料'; continue; }

// 示範用：依示範交易價位產生一段看起來合理的走勢
const DEMO_BARS = {};
function demoBars(st, int) {

}
function demoDaily(st) {

  const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  const anchors = data.trades.filter(t => t.stockId === st.id && t.date >= days[0]).map(t => ({ d: t.date, p: t.price })).sort((a, b) => a.d < b.d ? -1 : 1);

    const i0 = at(anchors[k]), i1 = at(anchors[k + 1]), K = i1 - i0;

    const w = [0]; for (let j = 1; j <= K; j++) w.push(w[j - 1] + gauss() * 0.016);
    for (let j = 0; j <= K; j++) {
      const base = Math.log(anchors[k].p) + (Math.log(anchors[k + 1].p) - Math.log(anchors[k].p)) * j / K;

    const c = close[i], prev = i ? close[i - 1] : c * 0.995;

function aggBars(daily, int) {

    else { const d = new Date(b.time + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); k = d.toISOString().slice(0, 10); }

function readAdvanced(f, n) {

// 刪除：放進回收桶，記住刪過（之後再匯入會提醒），並可以馬上復原
function trashNotes(ids, reason = 'delete') {
  const set = new Set(ids), at = Date.now(), snap = snapshot();
  const keep = [], gone = [];
  data.notes.forEach(n => (set.has(n.id) ? gone : keep).push(n));
  if (!gone.length) return 0;
  data.notes = keep;
  gone.forEach(n => { data.trash.push({ kind: 'note', item: n, at, reason }); if (reason === 'delete') data.tombs.push(tombKey(n)); });
  if (data.tombs.length > 8000) data.tombs = data.tombs.slice(-8000);
  MG.sel.forEach(id => { if (set.has(id)) MG.sel.delete(id); });
  commit();
  toastAct(`已刪除 ${gone.length} 條，放在回收桶 ${TRASH_DAYS} 天`, '復原', () => restoreSnap(snap));
  return gone.length;
}
// 復原用的快照：陣列先複製一份，被改的重點另外存原本的內容
function snapshot(ids) {
  const s = { data, notes: data.notes.slice(), strategies: data.strategies.slice(), trash: data.trash.slice(), tombs: data.tombs.slice(), dupIgnore: data.dupIgnore.slice(), imports: data.imports.map(x => Object.assign({}, x)), clones: new Map() };

}
function restoreSnap(s) {

  ['notes', 'strategies', 'trash', 'tombs', 'dupIgnore', 'imports'].forEach(k => { data[k] = s[k]; });
  const by = s.clones.size ? new Map(data.notes.map(n => [n.id, n])) : null;
  s.clones.forEach((json, id) => { const o = by.get(id); if (o) { Object.keys(o).forEach(k => delete o[k]); Object.assign(o, JSON.parse(json)); } });

}

function asTotals(date) {
  const by = { tw: 0, us: 0, cash: 0, oth: 0, debt: 0 }, hold = [];
  const C = calcAll(), fx = getFx().rate;
  data.stocks.forEach(st => {
    const c = C[st.id];
    if (!isHeld(st, c) || c.mv == null) return;
    const v = st.market === 'US' ? c.mv * fx : c.mv;
    by[st.market === 'US' ? 'us' : 'tw'] += v;
    hold.push({ st, v, c });
  });
  data.accounts.forEach(a => { const v = acctTwd(a); by[acctCat(a)] += v; if (v && acctCat(a) !== 'debt') hold.push({ a, v }); });
  const assets = by.tw + by.us + by.cash + by.oth;

}

const monthEnd = ym => { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); };

  if (!starts.length) return [];
  const cur = today().slice(0, 7), months = [];
  for (let m = starts[0].slice(0, 7); m <= cur; m = nextMonth(m)) months.push(m);
  const fxNow = getFx().rate;
  const priceAt = (st, ym) => {
    const h = AS.hist.get(newsKey(st)); let p = null;
    if (h) { for (let m = ym, i = 0; i < 36 && p == null; i++, m = prevMonthStr(m)) p = h.get(m); }
    if (p == null) { const t = data.trades.filter(x => x.stockId === st.id && x.date <= monthEnd(ym)).sort((a, b) => a.date < b.date ? 1 : -1)[0]; p = t ? t.price : null; }
    return p;

  return months.map(ym => {

    if (last) { const t = asTotals(); Object.assign(by, t.by); }

/* ---- 密碼保護：解鎖畫面、設定、自動上鎖 ---- */
function lockEl() {

// 解鎖：hdr 是要打開的金鑰（這台的，或雲端備份的）；成功回傳資料金鑰的原始位元組
function lockAsk(hdr, msg) {
  return new Promise(resolve => {
    const el = lockEl(); let rc = false;
    const draw = () => {
      el.innerHTML = `<form class="lock-box" autocomplete="on">
        <div class="lock-ic"><svg viewBox="0 0 24 24" class="ic"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>

        <input type="text" name="username" value="持股追蹤" autocomplete="username" hidden>
        ${rc ? '<input name="pw" class="lock-in" placeholder="救援碼（XXXXX-XXXXX-…）" autocomplete="off" autocapitalize="characters" spellcheck="false">'
          : '<input name="pw" class="lock-in" type="password" placeholder="密碼" autocomplete="current-password">'}
        <button class="btn pri lock-go" type="submit">解鎖</button>
        <div class="err" id="lockErr"></div>
        <button type="button" class="lnk faint small" id="lockRc">${rc ? '改用密碼' : '忘記密碼？用救援碼'}</button>
        ${hdr === VAULT.hdr ? '<button type="button" class="lnk faint small" id="lockWipe">兩個都忘了：清除這台裝置的資料</button>' : '<button type="button" class="lnk faint small" id="lockCancel">先不要</button>'}
      </form>`;
      const f = el.querySelector('form'), inp = f.elements.pw;
      setTimeout(() => inp.focus(), 50);
      el.querySelector('#lockRc').onclick = () => { rc = !rc; draw(); };
      const w = el.querySelector('#lockWipe');
      if (w) w.onclick = () => { if (confirm('清除這台裝置上的所有資料？\n\nGitHub 上的資料還是加密的，沒有密碼或救援碼也打不開。只有自己匯出、沒加密的備份檔才拿得回來。')) { wipeLocal(); } };
      const c = el.querySelector('#lockCancel');
      if (c) c.onclick = () => { el.hidden = true; resolve(null); };
      f.onsubmit = async e => {
        e.preventDefault();
        const v = inp.value; if (!v.trim()) return;
        const b = f.querySelector('.lock-go'); b.disabled = true; b.textContent = '解鎖中…';
        try { const raw = await unwrapDek(hdr, v, rc); el.hidden = true; resolve({ raw, rc }); }
        catch (err) { b.disabled = false; b.textContent = '解鎖'; f.querySelector('#lockErr').textContent = rc ? '救援碼不對' : '密碼不對'; inp.select(); }
      };
    };
    el.hidden = false; draw();
  });
}
// 開啟網頁時：先解鎖，再讀資料
async function vaultBoot() {
  if (!VAULT.on) return;
  document.documentElement.classList.add('locked');
  let r = null;
  while (!r) r = await lockAsk(VAULT.hdr);
  VAULT.dek = await importDek(r.raw);
  // 讀資料：IndexedDB 和 localStorage 都試，用比較新的
  const cands = [await idbGet('data'), localStorage.getItem(LS.data)];
  let best = null;
  for (const t of cands) {
    try { const o = typeof t === 'string' ? JSON.parse(t) : t; if (!o || !o.iv) continue; const d = JSON.parse(await vaultDec(o)); if (!best || (d.updatedAt || 0) > (best.updatedAt || 0)) best = d; } catch (e) { /* 這份壞了，用另一份 */ }
  }
  if (best) data = normalize(best);
  try { const s = load('st.sec'); if (s && s.iv) Object.assign(conf, JSON.parse(await vaultDec(s))); } catch (e) { /* 略過 */ }
  const q = await sGet('quotes'); if (q) quotes = Object.assign(quotes, q);
  syncState = { status: conf.token ? 'idle' : 'off', msg: '', at: 0 };
  document.documentElement.classList.remove('locked');
  VAULT.last = Date.now();
  if (r.rc) { VAULT.rawTmp = r.raw; setTimeout(() => { toast('用救援碼解鎖了，請設一個新密碼'); vaultChange(true); }, 400); }
}

// 把目前的資料、快取全部改成加密（或解密）存放
async function vaultMigrate(toOn) {
  const keys = []; const db = await idb();
  if (db) await new Promise(res => { try { const q = db.transaction('kv').objectStore('kv').getAllKeys(); q.onsuccess = () => { keys.push(...q.result); res(); }; q.onerror = () => res(); } catch (e) { res(); } });
  const plainKeys = keys.filter(k => typeof k === 'string' && /^(news|fin|base):/.test(k));
  if (toOn) {
    for (const k of plainKeys) { const v = await idbGet(k); await sSet(k, v); await idbDel(k); }
    for (const k of Object.keys(localStorage).filter(k => k.startsWith('st.h.'))) { await sSet(k, load(k)); localStorage.removeItem(k); }
    await sSet('quotes', quotes); localStorage.removeItem(LS.quotes);
  } else {
    // 關掉：已加密的快取直接丟掉（之後會重新抓），只留資料本身
    for (const k of keys.filter(k => typeof k === 'string' && k.startsWith('x:'))) await idbDel(k);
  }
}
async function idbDel(k) { const db = await idb(); if (!db) return; await new Promise(res => { try { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; } catch (e) { res(); } }); }
function wipeLocal() {
  Object.values(LS).forEach(k => localStorage.removeItem(k));
  ['st.data.idb', 'st.vault', 'st.sec', 'st.layout'].forEach(k => localStorage.removeItem(k));
  Object.keys(localStorage).filter(k => k.startsWith('st.h.')).forEach(k => localStorage.removeItem(k));
  try { indexedDB.deleteDatabase('stock-tracker'); } catch (e) { /* 略過 */ }
  setTimeout(() => location.reload(), 300);
}

/* ---- 找疑似重複：同一檔、文字相近、日期相近；數字不同（例如不同季度）就不算 ---- */
const bigr = s => { const g = new Set(); for (let i = 0; i < s.length - 1; i++) g.add(s.slice(i, i + 2)); if (s.length === 1) g.add(s); return g; };
const dice = (a, b) => { if (!a.size || !b.size) return 0; let k = 0; for (const x of a) if (b.has(x)) k++; return 2 * k / (a.size + b.size); };
const pairKey = (a, b) => a < b ? a + '|' + b : b + '|' + a;
function findDups(list) {
  const ign = new Set(data.dupIgnore), by = new Map(), groups = [];
  list.forEach(n => { if (!by.has(n.stockId)) by.set(n.stockId, []); by.get(n.stockId).push(n); });
  by.forEach(arr => {
    if (arr.length < 2) return;
    const info = arr.map(n => { const t = normT(n.title); return { n, bg: bigr(t), bb: bigr(t + normT(n.body).slice(0, 60)), num: (n.title.match(/\d+(?:\.\d+)?/g) || []).join('|'), day: (n.date_precision || 'day') === 'day' ? Date.parse(n.date) : null }; });
    const idx = new Map();
    info.forEach((x, i) => x.bg.forEach(g => { let p = idx.get(g); if (!p) idx.set(g, p = []); p.push(i); }));
    const par = info.map((_, i) => i), find = i => { while (par[i] !== i) i = par[i] = par[par[i]]; return i; };
    info.forEach((x, i) => {
      const cand = new Map();
      x.bg.forEach(g => { const p = idx.get(g); if (p.length > 400) return; for (const j of p) if (j > i) cand.set(j, (cand.get(j) || 0) + 1); });
      cand.forEach((c, j) => {
        const y = info[j];
        if (c < Math.min(2, x.bg.size, y.bg.size)) return;
        if (x.num && y.num && x.num !== y.num) return;
        if (x.day != null && y.day != null && Math.abs(x.day - y.day) > 14 * 864e5) return;
        if (Math.max(dice(x.bg, y.bg), dice(x.bb, y.bb)) < 0.6) return;
        if (ign.has(pairKey(x.n.id, y.n.id))) return;
        par[find(i)] = find(j);
      });
    });
    const gm = new Map(); info.forEach((x, i) => { const r = find(i); if (!gm.has(r)) gm.set(r, []); gm.get(r).push(x.n); });
    gm.forEach(g => { if (g.length > 1) groups.push(g.sort((a, b) => (a.ts || 0) - (b.ts || 0))); });
  });
  return groups.sort((a, b) => b.length - a.length);
}
// 每組留下資訊最完整的一條（內容長、有來源、有依據、已查證），一樣就留最早匯入的
function mgDupKeepScore(n) { return (n.body || '').length + (n.source ? 30 : 0) + (n.analyst ? 10 : 0) + ((n.evidence_ids || []).length + refsOf(n).length) * 25 + (n.verification_status === 'verified' ? 60 : 0); }

/* ---- 分類：合併同義的子主題、把不在規範裡的主題併進來 ---- */
function mgSynonyms(subs, fixed) {
  const out = new Map(), lev1 = (a, b) => {
    if (Math.abs(a.length - b.length) > 1) return false;
    let i = 0, j = 0, d = 0;
    while (i < a.length && j < b.length) { if (a[i] === b[j]) { i++; j++; continue; } if (++d > 1) return false; if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; } }
    return d + (a.length - i) + (b.length - j) <= 1;
  };
  for (let i = 0; i < subs.length; i++) for (let j = i + 1; j < subs.length; j++) {
    const A = subs[i], B = subs[j]; if (fixed.includes(A) && fixed.includes(B)) continue;
    const a = normT(A), b = normT(B); if (!a || !b) continue;
    const s = (a.length >= 2 && b.length >= 2 && (a.includes(b) || b.includes(a))) || dice(bigr(a), bigr(b)) >= 0.5 || (Math.min(a.length, b.length) >= 3 && lev1(a, b));
    if (!s) continue;
    if (!out.has(A)) out.set(A, []); if (!out.has(B)) out.set(B, []);
    out.get(A).push(B); out.get(B).push(A);
  }
  return out;
}

  const topics = [...tree.keys()].sort((a, b) => { const ia = DEFAULT_TOPICS.indexOf(a), ib = DEFAULT_TOPICS.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || COLL.compare(a, b); });
  const k = MG.catSel.size;
  $('#mgTools').innerHTML = `<select data-mgcat aria-label="範圍"><option value="">全部標的</option>${data.stocks.map(s => `<option value="${s.id}" ${MG.catStock === s.id ? 'selected' : ''}>${esc(s.code)} ${esc(s.name || '')}</option>`).join('')}</select>
